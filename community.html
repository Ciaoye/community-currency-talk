:[["住宿","农场参与、换宿、朋友与社区的空房","house"],["衣物","合作社交换、社区流通、朋友与家人","sprout"],["食物","活动与农场食宿、分享剩余资源","toast"],["会议室","众筹、支教支持、再向朋友借用","cap"]],"narration":"上次分享时，我已经不花钱住宿三年多。衣物、食物和会议室，也有交换、分享和参与的途径。这里包含朋友、家人的支持，也包含我付出的时间和精力。生活的资源一直来自很多人。"},{"id":3,"layout":"chain","group":0,"title":"一条很熟悉的生活路径","subtitle":"我常把它概括成：教育、工作、消费、保险","items":[["教育","就业资格"],["工作","获得收入"],["消费","满足需求"],["保险","应对风险"]],"narration":"我们通过专业化教育获得工作，再通过收入满足需要，通过制度和金融工具应对不确定性。我观察到，这条链也在定义我们怎样介绍和评价一个人。如果一环断了，我的生活还有没有别的办法？"},{"id":5,"layout":"framework","group":0,"title":"我想把生活重新连接起来","subtitle":"从我真正的需要出发","items":[["教育","认识自己，获得真正需要的知识与生存技能"],["工作","做自己喜爱的事情，直接创造价值"],["消费","用充满创造力的方式满足需求"],["保障","积累多元的能力、关系和资源渠道"]],"narration":"我仍然面对教育、工作、消费和保障这些问题。只是我想探索：认识自己，创造价值，用更多方式满足需要，让生活的支持来自多元的能力、关系和资源渠道。"},{"id":6,"layout":"options","group":0,"title":"我想要什么？我怎么获得？","subtitle":"选项可以被发现，也可以被创造","items":[["购买","当下花钱最合适，就可以购买"],["交换","用自己的价值回应别人的需要"],["分享","剩余资源流向刚好需要的人"],["借用","需要使用，也可以不先拥有"],["创造","自己参与，或一起做出新的东西"],["互助","让愿意参与的人一起回应请求"]],"narration":"认识自己的需要后，购买、交换、分享、借用、创造、互助都可能成为选项。每个人需要的选项不同，我们要找的是舒服、满意的方式。"},{"id":7,"layout":"statement","group":0,"title":"Don’t do it yourself","subtitle":"许愿，把需要说出来，然后共同创造","items":[],"accent":"green","narration":"这同样延续 Don’t do it yourself。我想要什么，可以说出来；有什么资源、技能和想法，也可以邀请别人一起参与。我们一起，可能创造原本不存在的选项。"},{"id":8,"layout":"cycle","group":0,"title":"每一次参与，都会留下下一次的选项","subtitle":"生活韧性，也长在人与人的关系里","items":[["能力","发现自己可以做什么"],["关系","认识一起做事的人"],["资源渠道","知道下一次可以向哪里求助"]],"narration":"通过实践，我获得新的能力，认识更多人，也发现新的资源渠道。这些不是一次用完的东西。它们会成为下一次创造选项的条件。个人的韧性，也来自我与周围世界的连接。"},{"id":9,"layout":"section","group":1,"title":"在这个社区里，\n我们已经怎样生活？","subtitle":"先看已经发生的流动","items":[],"accent":"green","narration":"在做工具之前，我想先看看社区里已经发生了什么。大家本来就在分享、交换和互相帮助。交换圈要从这些关系里长出来。"},{"id":10,"layout":"story","group":1,"title":"水果吃不完，就分给大家","subtitle":"无偿分享","items":[["“我的就是你的”","基于信任，不求回报，也不一定求被看见"]],"narration":"比如水果吃不完，多出来的就分给大家。这种分享可以有来有回，也可以没有回报。它本来就是我们生活在一起的一部分。"},{"id":11,"layout":"story","group":1,"title":"你给我住宿，\n我能为你做些什么？","subtitle":"用交换代替购买","items":[["一起找到认可的方案","有时候是举手之劳，有时候是更具体的参与"]],"narration":"我长期获得免费住宿，也会留意我能提供什么。如果还没有足够的信任，我们能不能找到一个大家都认可的交换方案？交换也可以在相处中慢慢长出来。"},{"id":12,"layout":"words","group":1,"title":"有些互助，确实需要花力气","subtitle":"成本互助","items":[["搬家","时间与体力"],["按摩","技能与精力"],["咨询","经验与专注"],["修电脑","知识与劳动"]],"narration":"帮忙搬家、按摩、咨询、修电脑，都需要时间、精力和技能。它们可以在社区内部流动，但也需要一个双方认可的交换框架。"},{"id":13,"layout":"rows","group":1,"title":"这几种流动，可以同时存在","subtitle":"每一种，都有自己的成立方式","items":[["无偿分享","基于信任，可以不求回报"],["交换","双方找到认可的方式"],["成本互助","承认时间、精力与技能的投入"]],"narration":"分享、交换和有成本的互助可以并存。我们不必让每一种流动都使用同一个机制，也不需要把原有的分享都变成交易。"},{"id":14,"layout":"statement","group":1,"title":"我希望很多价值，\n能留在社区里","subtitle":"用社区内部的循环，创造更多生活选项","items":[],"accent":"yellow","narration":"我希望用自己的创造代替消费，用交换代替购买，用社区内部的循环替代一部分对外部市场的依赖。让更多创造力和连接发生在人和人之间，缩短中间的媒介。"},{"id":15,"layout":"section","group":2,"title":"社区里已有很多资源\n流动，为什么仍然卡住？","subtitle":"信任、可见性和开口的障碍","items":[],"accent":"pink","narration":"资源已经存在，愿意帮助人的人也已经存在。但为什么很多需要还没被回应？我看到的障碍，主要在于信任不能传递、付出不可见，以及不好意思开口。"},{"id":16,"layout":"network","group":2,"title":"这些交换，仍然绕不开我","subtitle":"我认识你，也认识他；你们之间却未必相识","items":[],"network":"hub","narration":"我的活动、咨询都可以不付费交换，我也长期获得免费住宿。但这些关系通常只有两个人参与。我认识很多人，他们之间却未必能交换。这些关系仍然绕不开我。"},{"id":17,"layout":"dialogue","group":2,"title":"我们想交换，\n但需要没有刚好对上","subtitle":"对象、需要和时间，不一定恰好匹配","items":[["甲","我今天可以给你帮助。"],["乙","可我现在没有你需要的东西。"],["后来","以后有机会再交换——但一直没有兑现。"]],"narration":"有时双方愿意交换，但当下没有恰好匹配的东西。先欠着，等以后有机会。可它也可能一直没有兑现。一个给我好东西的人，能不能从别人那里获得好东西？"},{"id":18,"layout":"columns","group":2,"title":"我信任的人，\n怎样被更多人了解？","subtitle":"信任不能只停在两个人之间","items":[["我知道","他曾经帮过我，我们共同做过事情。"],["别人还不知道","他给过什么、与谁有过连接，这些信息没有流通。"]],"narration":"比如有人在群里问免费住宿，但提供住宿的人还不了解他。他曾经给过什么、是什么样的人，这些信息不流通。我很难替所有人判断关系，也很难帮他们直接达成交换。"},{"id":19,"layout":"words","group":2,"title":"这些事情，谁一直在做？","subtitle":"社区里看不见的劳动","items":[["打扫",""],["整理",""],["照料",""],["维护",""]],"narration":"打扫、整理、照料，还有维护社区和工具的工作，常常由少数人反复承担。事情做好了，却不一定被看见。我们能不能更具体地注意到这些劳动？"},{"id":20,"layout":"story","group":2,"title":"“我帮了你”\n只有你和我知道","subtitle":"付出不可见","items":[["私下的五次帮助","如果信息没有流通，社区仍然不了解这些贡献。"]],"narration":"一个人可能帮过好几个人，但每次都是私下的。在社区层面，他的付出仍然不可见。这不是故意忽视，而是信息没有流通。"},{"id":21,"layout":"statement","group":2,"title":"少数人反复承担，\n也会疲惫","subtitle":"让隐形劳动被看见，是关系能否持续的问题","items":[],"accent":"pink","narration":"如果少数人一直承担看不见的工作，他们容易疲惫，难以持续。被看见，不只是夸奖一句，也关系到社区怎样了解和支持正在付出的人。"},{"id":22,"layout":"columns","group":2,"title":"愿意给，却不好意思拿","subtitle":"循环也会断在没有人接受","items":[["我愿意给","我能做什么？我有什么可以分享？"],["我不敢要","会不会麻烦别人？我能不能不花钱获得帮助？"]],"narration":"很多人愿意登记自己能给什么，却不敢提出自己的需要。我们还可能默认有成本的服务只能用钱买，不会想到在社区里寻求别的交换方式。没有人接受，循环也会断掉。"},{"id":23,"layout":"question","group":2,"title":"当别人接受帮助，\n流动才继续发生","subtitle":"愿意给的人，也需要有人能够自在地接受","items":[],"narration":"如果所有人都愿意给，却没有人开口拿，流动也不会发生。帮助和被帮助需要一起成立。让人更容易提出小请求，是这套实验非常重要的一部分。"},{"id":24,"layout":"network","group":3,"title":"让这些点，彼此看见","subtitle":"因我而连接起来的人，他们之间也能流动","items":[],"network":"mesh","narration":"我希望让已经在我身边建立的交换关系，能彼此看见，组成一个网络。因为我而连接起来的这些人，他们之间也能流动。信任可以传递，贡献可以得到更广的回应。"},{"id":25,"layout":"layers","group":3,"title":"交换圈的三层设计","subtitle":"基础是关系，机制在需要的时候加入","items":[["01","交换与分享","求助、给予、一对一交换，原本就在发生。"],["02","感谢的信号","接收者主动表达看见，让善意被了解。"],["03","有成本的互助","双方认可记账，让贡献在圈内继续流动。"]],"narration":"第一层是已经存在的交换与分享。第二层是好人卡，表达感谢和被看见。第三层是有成本的互助使用的记账框架。它们各自回应不同的问题。"},{"id":26,"layout":"statement","group":3,"title":"愿意免费就免费\n愿意不记就不记","subtitle":"基础交换不需要工具来许可","items":[],"accent":"green","narration":"基础是交换与分享。大家尝试求助，看能不能相互给予。可以不求回报，也可以一对一交换。愿意免费就免费，不需要替代或介入已经存在的善意交换。"},{"id":27,"layout":"section","group":3,"title":"一句感谢，\n让善意被看见","subtitle":"第二层：好人卡","items":[],"accent":"coral","narration":"在已有的分享之上，接收者如果愿意，可以主动多做一个动作：留下感谢。它表达我感受到了什么，也让更多人有机会看见这段关系。"},{"id":33,"layout":"section","group":3,"title":"有成本的互助，\n需要一个交换框架","subtitle":"第三层：社区范围内的记账","items":[],"accent":"blue","narration":"按摩、修电脑、搬家和咨询，确实有时间、精力和技能成本。对于这样的互助，我们可以使用双方都认可的交换框架。"},{"id":34,"layout":"question","group":3,"title":"我可以开口请求帮助","subtitle":"即使我们暂时没找到能直接互换的东西","items":[],"narration":"这个机制是为了让提出需求的人更容易求助。我提出请求，另一个人愿意回应，不需要马上想好我能给他什么。有一个圈内认可的交换框架，会帮助人更容易开口。"},{"id":35,"layout":"ledger","group":3,"title":"今天帮你，明天向别人求助","subtitle":"同一个圈子，三个人从 0 开始","items":[],"narration":"甲帮乙修电脑，双方协商十点。甲加十，乙减十。后来丙帮甲做饭，也商量十点。甲回到零，丙加十。甲不用等乙恰好有自己需要的东西，才能获得下一次帮助。"},{"id":38,"layout":"columns","group":3,"title":"给过，也接受过帮助","subtitle":"两种经历都可以被承认","items":[["正余额","曾经提供帮助。对网络保留未来请求的可能。"],["负余额","曾经接受帮助。也保留未来贡献的承诺。"]],"narration":"帮助和被帮助是平等、互相成就的事情。正数可以记录给过，负数可以记录接受过帮助。它们不定义一个人的价值，也不应该让负余额变成羞耻。"},{"id":42,"layout":"section","group":4,"title":"关系里，\n必须保留选择","subtitle":"请求、拒绝与社区边界","items":[],"accent":"pink","narration":"如果记录和额度让人更难拒绝，或者让人觉得自己必须服务所有人，机制就没有达到我的目的。我们需要让选择仍然保留在人的关系里。"},{"id":43,"layout":"equation","group":4,"title":"我可以提供","subtitle":"我想向所有人提供","items":[],"symbol":"≠","narration":"我可以提供，不等于我想向所有人提供。写下一个技能或一种资源，不是在对所有人签下一份随时可以要求兑现的契约。"},{"id":44,"layout":"equation","group":4,"title":"我想要","subtitle":"谁给我，我都必须接受","items":[],"symbol":"≠","narration":"填了我想要，也不意味着谁给我，我都必须拿。接受什么帮助，怎样相处，也需要由自己选择。"},{"id":47,"layout":"boundaries","group":4,"title":"一个交换圈，需要明确的边界","subtitle":"我们怎样在这个范围里建立信任？","items":[["谁可以参与","先理解这个社群的关系与约定。"],["什么愿意开放","免费住宿，也需要提供者自己选择。"],["具体怎样交换","自己敲门，找到喜欢的人与关系。"]],"narration":"我不能告诉所有人：你去找谁就一定可以免费住。因为这不是一个对所有人开放的契约。一个圈子需要明确边界，而人在关系里的偏好与选择也要保留。"},{"id":48,"layout":"statement","group":4,"title":"没有记录的善意，\n仍然成立","subtitle":"免费、礼物与不记账的流动，需要持续维护","items":[],"accent":"green","narration":"社区货币不能替代已经存在的流动。免费的、纯分享的、不记账的善意，需要被持续维护和示范。工具只是增加一个选项。"},{"id":50,"layout":"scenarios","group":5,"title":"同一套理念，长在不同的关系里","subtitle":"三种实践场景","items":[["身边的交换网络","让点对点的关系彼此看见"],["小范围共建共创","在约定时间和范围内一起交换"],["线下常驻社区","让日常互助和隐形劳动被了解"]],"narration":"它可以从我身边的交换网络开始，也可以是有既定时间的一群人共同创造，或者一个线下常驻社区。每种关系的范围、需要和约定都不同。"},{"id":51,"layout":"story","group":5,"title":"我们一起住、一起做事\n也一起维护这个地方","subtitle":"线下常驻社区","items":[["日常的互助","写下需要与提供，具体交换双方商量。"],["公共的维护","打扫、整理、照料与维护劳动，都可以被看见。"]],"narration":"在常驻社区里，互助就在日常生活中。我们可以写下给你、给我的清单，价格双方商量。维护这个空间和维护工具的劳动，也应该被看见。负余额不应被污名化。"},{"id":52,"layout":"story","group":5,"title":"有一段共同生活的时间\n也可以有一个明确的交换范围","subtitle":"小范围共建共创","items":[["在这个圈内尝试","请求帮助、互相提供服务、许愿、悬赏与打赏。"],["先说清约定","参与范围、初始安排，以及不向圈外流通的边界。"]],"narration":"有既定时间的一群人共创，也可以做实验。大家在约定的圈子里请求帮助、提供服务、许愿或悬赏。文档曾提出初始抵押兑换的方案，它是一种特定场景的设想，不是所有交换圈的统一起点。"},{"id":59,"layout":"invitation","group":5,"title":"现在，你有什么\n小小的愿望？","subtitle":"从一件具体的小事开始","items":[["我想要","我正在需要什么帮助？"],["我愿意给","我有什么愿意分享、交换或共同创造？"]],"narration":"现在你有什么小小的愿望？你愿意给什么？我们可以先从一件具体的小事开始。提供什么、接受什么，都可以自己选择。"},{"id":60,"layout":"statement","group":5,"title":"我们一起，\n创造一个新的生活选项","subtitle":"让更多的创造力和连接，发生在人和人之间","items":[],"accent":"yellow","narration":"我想建立一个明确的交换圈，让已经存在的关系彼此看见，让请求更容易，也让选择和善意继续保有空间。我们一起，可以创造一个新的生活选项。"},{"id":61,"layout":"demo","group":5,"title":"接下来，\n演示流动圈","subtitle":"工具在这里，关系由我们一起创造","items":[],"narration":"接下来，我演示流动圈。具体功能可以现场看。我更关心的是，它有没有支持到我们在这个社区里真正想发生的关系。"}]</script><script src="assets/deck.js"></script></body></html>
