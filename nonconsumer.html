定了我们的身份，我们的品味，我们的生活方式，东西我觉得是好的，东西我觉得不好。它是一个，已经是我们去评价一个人或者介绍一个人或者感受一个人很强硬的标准，它是一套在工业体系下发展了很多年而形成的。然后对我来说，我发现我想要的是另外一个路径，比如说我觉得教育我，我前段时间在农场种地，然后我去年也去，我也拉了一波人，我去清迈盖房子，那个时候也拉了一波人去做，手搓的房子，一个手搓的自给自足的房子，我发现我们，或者我还去做很多自我探索的工作，就这些我觉得是我们必须要受的教育，但这些是，我们很多时候并没有得到的。\n\n我们通过专业化教育获得工作，再通过收入满足需要，通过制度和金融工具应对不确定性。我观察到，这条链也在定义我们怎样介绍和评价一个人。如果一环断了，我的生活还有没有别的办法？"},{"id":8,"layout":"rows","group":0,"title":"消费，也承载了情绪、社交和身份","subtitle":"很多需要，已经和购买绑在一起","items":[["情绪","工作累了，想买一点东西，安慰或奖励自己。"],["社交","见朋友，常常变成去哪家餐厅、参加什么消费活动。"],["身份","用消费表达品味、生活方式，也用它评价一个人。"]],"origin":"personal","narration":"整体上我想先讲一下，我在做了这么多之后我去理解我怎么去理解消费或者不消费这件事情，我之前写过文章，我们在，一个教育工作消费的链条上面，首先我们获得的教育，它是一种专业化的教育，它并不教导你那些生存的技能，怎么种地，怎么分辨食物，怎么做饭，然后怎么好好睡觉，所有跟你活着的什么你你什么是爱，什么是生命，这些他都不教他教的是你怎么拿到一个文凭找来工作，他教你专业化的技能，他是为了让你去工作，我们在工作的时候我们会有专业化的工作，\n\n专业化的分工就是一个工作，它会拆成，是亚当斯密国富论写一根造针的厂，如果工人，他要从磨针，他要做完所有的步骤。效率很低，他把这个工序拆成了一大堆，每一个人只专注那动作，他只做磨动作，他就只做把这个 a 放到 B 这个动作他就有了专业化生产。它这个效率就很高，就是你受教育是为了你能获得这个工作，然后你然后这个是以前作为一个体面人，我们就需要获得好的教育和有好的工作，然后再慢慢的发展到现代，我们又需要消费，消费决定了我们的，我们的阶级我们是一个有品位的人，或者我们是什么是靠我们的消费来完成的，我们有没有一个很好的收入之类的，它基本上是一条非常完整的链条，一个你认为成功的人，\n\n他可能代表了他有好的，他一个人介绍自己的时候，他会用我受了什么教育，我是什么学校毕业的，然后我从事什么工作，多少年了，然后。什么什么数据，然后我，然后也许我有一些爱好，这些爱好可能是消费型的，我很喜欢喝咖啡，大概是这样一个链条，然后同时它，比如惠有，比如惠有。稍等你，你那边要完全静音，你可以，你可以试试，不连音频就完全不连音频看，你取消音频，这样就不会串，你停用电脑音频。好，可以太好了，好，我们线下也解决了，然后，还有一个，因为也我这次收集问题的时候有人问，比如说你要不要买社保，然后你要不要，你要医疗保险？养老保险是怎么解决的，然后我觉得保险也是很重要的一环，我们有很多金融工具被发明出来去解决很多问题，然后保险是为了应对一些未来的不确定性，很多时候我们的钱工资刚一到账上，它可能就划给了各种消费或者各种保险，或者是工资到我们手上，之前在公司那里就已经划给保险了，保险不一定是我们有选择的。\n\n这个公司，它就直接理论上就已经上交给保险，但是这个保险到底交的是哪些保险，它到底你能怎么获得这个东西是不清楚的。比如我现在做一些工人的放映，他们很多工人灵活就业的，他们是不想要买保险的，他们今年在这个城市，明年在城市，他们的保险交掉了，首先他们的收入会减少很多，他们会觉得保险我其实是根本拿不到的，我其实在为城市做贡献，然后我已经很底层了，我居然为你们这些城里人做贡献，他觉得这个事情是很奇怪的。\n\n然后。所以这些是我们已经存在的链条，一个专业化的学习通向专业化的岗位，我们以来成为一个很好的社会人，我们可能会工作累了，我们就得消费一点东西，我们得买点东西，然后我们因为有了很多消费，比如说，我问一下线上的有认真线上的链接，发到群里面，我这边看不到，你看不太清。有人发就行，比如说现，比如说还有金融工具，它叫贷款，然后它就能让你有一个让你觉得你需要一个稳定的收入，比如说你每个月要还房贷，它是首先预支了你未来的所有的支出，然后因为你要买房，你才能获得很多你想要的东西，你想要稳定，比如说有人问，我需要一个地方放我很多的东西。他慢慢有了需求，有一个很好的金融工具，它可以预支你之后的收入，你可以贷一笔款，你每个月你的账上就是你的账上钱 你认识到你自己是什么，然后你跟你周围建立一些有意义的关系，它不一定说你要有很多朋友，你会比如说我刚才说跟物品建立有意义的关系，你想和你的物品。你很喜欢你的东西，你不会很容易的就丢弃它，你可能会跟周围的人建立关系，你会想我们能一起做什么事情，这个是我，我发现我在幻宿在各种，去寻找一个。我的幻速，我并不惠认为一种打工，而是因为我很喜欢你的这个地方，然后我很认可你的理念，所以我要来帮你跟你一起做这件事情，我一定喜欢我才惠来问你，然后在你在我跟你说和你拒绝我，或者你说不行，或者你说，但是我需要什么什么的时候，我知道你的需求是什么，我就知道，原来你是你想要的是，那我怎么能够和你一起来抵达，我怎么能够和你共同创造一个，我们都觉得东西是好的，我能不能贡献我的力量？因为我觉得我的力量是很值钱的，然后我并不会很容易卖它，但是我也并不会经常用去用它来获得钱。"},{"id":11,"layout":"framework","group":0,"title":"我想把生活重新连接起来","subtitle":"从我真正的需要出发","items":[["教育","认识自己，获得真正需要的知识与生存技能"],["工作","做自己喜爱的事情，直接创造价值"],["消费","用充满创造力的方式满足需求"],["保障","积累多元的能力、关系和资源渠道"]],"origin":"personal","narration":"消费它代表了很多，比如说当我们出去玩，他可能关注的是我们去哪儿吃饭，然后我们去哪个地方玩，它代表了很多消费的项目，然后我们跟朋友一起出去玩，它可能也代表了，我们要去哪儿吃个饭，它都是跟很多消费的行为挂钩，然后它也决定了我们的身份，我们的品味，我们的生活方式，东西我觉得是好的，东西我觉得不好。它是一个，已经是我们去评价一个人或者介绍一个人或者感受一个人很强硬的标准，它是一套在工业体系下发展了很多年而形成的。然后对我来说，我发现我想要的是另外一个路径，比如说我觉得教育我，我前段时间在农场种地，然后我去年也去，我也拉了一波人，我去清迈盖房子，那个时候也拉了一波人去做，手搓的房子，一个手搓的自给自足的房子，我发现我们，或者我还去做很多自我探索的工作，就这些我觉得是我们必须要受的教育，但这些是，我们很多时候并没有得到的。\n\n然后工作，我是毕业后我本科毕业10年快10年，然后我也没有去公司正经工作过，他工作，他理论上我们想要工作，为了赚钱，可能为了，赚钱，可能还有别的原因，为什么要赚钱，还有我们可能想要有些意义，我们是想为社会提供价值的，那我们能不能用我们的方式创造价值，这个可能不是今天分享的，明天还有一场，在忘了在，反正也是明天在社区的活动，然后也有线上是关于大家是怎么赚钱的，或者大家。是怎么去理解自己在做什么，和你觉得做的舒不舒服的就明天惠有一场活动，所有人来分享这个部分，\n\n然后，明天在日历上有多元生活与生计。创造可能性创造小组，然后消费去满足，消费我们可以通过更创造性的方式去满足自己的需求，然后我们的保险是为了建立韧性，所以我觉得我发现，我想做的，\n\n摆脱依赖，我们能不被链条依赖，它意味着我们需要创造更多的可能性，我并不在教一个，就纯粹我们怎么省钱之类的，我们怎么特别降低物欲也好，怎么省钱，它可能也包括这些，它主要其实是让我们能够摆脱一套东西的依赖，让我们获得更多的自由，比如说我根本就不用花什么钱，比如说我们很多时候在社区住，它可能几百块钱一个月，你就。担心你的生存，你就可以有时间去探索一些你想探索的东西，然后你就会发现更多的选项，比如说有些选项，它能为你带来收入。有些选项为你带来一些别的东西，你就能建立一些韧性，韧性的意思抵抗风险。\n\n比如说我们买保险是为了。抵抗风险，比如说斩杀线就是一个工作，现在也不能帮你抵抗风险，工作，它也可能惠消失，老板可能也会破，公司可能会破产，老板可能会裁员，它有很多的不确定因素。就是要建立韧性，你可能要建立多元的收入的管道，你可能要建立更多的社会支持的体系，你可能认识更多的人，你可能有更多元的技能，你可能知道，我是怎么能在阳台里有一片地能让我吃饱，这些都是在。去摆脱那唯一东西的依赖，这样就不会像比如说斩杀线，因为这个链条是非常的，丰满的，就美国一个人失掉了他的工作，他马上他就交不起他的，他的保险，他交不起医疗保险，然后他马上交不起他的房贷，他马上付不起他的房租，然后整个链条就会崩塌，就是因为依赖了链条，所以他需要自给自足，激发创造性，\n\n因为很多时候你的选项是你唯一的，比如说有人问我想带猫带狗怎么办，或者我很想，我对住宿有这样的要求，我对我的生活有这样的要求，那怎么办？这个时候需要有更多的创造性去为你创造唯一的选项，所以我并没有提供，并没有办法提供，就是对你来说是唯一的选项，比如说有的人，我换宿的时候受人欺负了，怎么？你也可以不换速，你就可以找，不对你来说，合适的选项我们每一个人都有必要为自己找到，有对自己来说。舒服的，满意的选项，它是我们能够在社会上更舒服生活的重要的什么，这句话说不出来了，好，就先这样吧。\n\n我仍然面对教育、工作、消费和保障这些问题。只是我想探索：认识自己，创造价值，用更多方式满足需要，让生活的支持来自多元的能力、关系和资源渠道。"},{"id":12,"layout":"words","group":0,"title":"摆脱依赖 · 建立韧性 · 激发创造性","subtitle":"当一条路径失效，仍然有其他选项","items":[["摆脱依赖","不只依赖一个工作、一种收入或一种生活安排"],["建立韧性","积累能力、支持关系和资源渠道"],["激发创造性","为自己的具体需要，创造合适的选项"]],"accent":"green","origin":"personal","narration":"摆脱依赖，我们能不被链条依赖，它意味着我们需要创造更多的可能性，我并不在教一个，就纯粹我们怎么省钱之类的，我们怎么特别降低物欲也好，怎么省钱，它可能也包括这些，它主要其实是让我们能够摆脱一套东西的依赖，让我们获得更多的自由，比如说我根本就不用花什么钱，比如说我们很多时候在社区住，它可能几百块钱一个月，你就。担心你的生存，你就可以有时间去探索一些你想探索的东西，然后你就会发现更多的选项，比如说有些选项，它能为你带来收入。有些选项为你带来一些别的东西，你就能建立一些韧性，韧性的意思抵抗风险。\n\n比如说我们买保险是为了。抵抗风险，比如说斩杀线就是一个工作，现在也不能帮你抵抗风险，工作，它也可能惠消失，老板可能也会破，公司可能会破产，老板可能会裁员，它有很多的不确定因素。就是要建立韧性，你可能要建立多元的收入的管道，你可能要建立更多的社会支持的体系，你可能认识更多的人，你可能有更多元的技能，你可能知道，我是怎么能在阳台里有一片地能让我吃饱，这些都是在。去摆脱那唯一东西的依赖，这样就不会像比如说斩杀线，因为这个链条是非常的，丰满的，就美国一个人失掉了他的工作，他马上他就交不起他的，他的保险，他交不起医疗保险，然后他马上交不起他的房贷，他马上付不起他的房租，然后整个链条就会崩塌，就是因为依赖了链条，所以他需要自给自足，激发创造性，\n\n因为很多时候你的选项是你唯一的，比如说有人问我想带猫带狗怎么办，或者我很想，我对住宿有这样的要求，我对我的生活有这样的要求，那怎么办？这个时候需要有更多的创造性去为你创造唯一的选项，所以我并没有提供，并没有办法提供，就是对你来说是唯一的选项，比如说有的人，我换宿的时候受人欺负了，怎么？你也可以不换速，你就可以找，不对你来说，合适的选项我们每一个人都有必要为自己找到，有对自己来说。舒服的，满意的选项，它是我们能够在社会上更舒服生活的重要的什么，这句话说不出来了，好，就先这样吧。\n\n好，然后这三个点，是我从转型城镇抄下来的转型城镇，他们做的自给自足的社区，他们比如说社区会自己发电，他们会推广每一家的，太阳能发电，他们就会建立韧性，这样的日本当资源不足的时候，停电就不会影响到他们城市，他们做很多这样的东西，这个社区货币的理念，我也是从那本书吸收，虽然有很多人曾经做过事情，转型城镇是让我真实的看社区账本的东西，我们之后也会再讲这些好的。\n\n所以我觉得不消费它不是它的原则，不是不花钱，我不会，我不会很死磕，我真的什么东西都不花钱，比如说我这台电脑非常昂贵，然后它很贵，我觉得我可能没有办法从别的渠道获得它，那我就花钱买它，然后我有一些需求，我最近想玩 switch2的游戏，switch 二对我来说又不是一个生产力工具，我找了一个有 switch2的朋友，我买我想玩的游戏卡带，然后让他借我，这个东西很容易闲置，一定它有很多的方法，然后红姐是启发我做不消费的人，我之后会把也发到群里播客，或者有人会发，我觉得有人应该会发红姐的播客，就红姐，"},{"id":13,"layout":"question","group":0,"title":"我想要的，\n到底是什么？","subtitle":"想要一套房子，可能也在寻找安全感、归属感或放行李的地方","items":[],"origin":"personal","narration":"我觉得如果你朋友不多，你要么如果你真的愿意建朋建立朋友，你想找朋友，那就想我要怎么找朋友，如果你觉得这些人我都不喜欢，我就不喜欢人类，那你要去找自己的方法，你去森林里面采蘑菇，我觉得也算，红姐她就喜欢去森林里面，她一天去那边采蘑菇让采蘑菇吃，然后种了一。菜在公司，他在公司的花园种的，对他说，他还会去借邻居家的地种地，因为邻居家很多，比 d":18,"layout":"statement","group":0,"title":"Don’t do it yourself","subtitle":"许愿，把需要说出来，然后共同创造","items":[],"accent":"green","origin":"community","narration":"这同样延续 Don’t do it yourself。我想要什么，可以说出来；有什么资源、技能和想法，也可以邀请别人一起参与。我们一起，可能创造原本不存在的选项。\n\n我不喜欢做的事情，就有些事情我觉得，不是我做的，我就惠想办法把它交给别人，比如说，比如说这个群我不想加大家好友拉大家进群，我愿意加大家好友，我不想点开那个群，然后把人拉进去，工作我不会做，比如说刚才我在这边我也寻求了很多帮助，帮我把臀椅打开，但是我不想在我电脑上投屏，因为我要专注在我现在要的分享上，我会去区分哪些是做哪些不想做的，我会专注在我想做那个事情上，然后我相信它能创造价值，它能够给周围的其他人带来价值，我觉得是跟社会的联系。然后再远一点跟自然的联系，它是他是非常怎么说，它是不太变动的东西，它是一个非常稳定的东西。你跟自然有联系，你感觉这一切，焦虑都没有那么重大，一些人类社会的焦虑，它其实也都没有那么重大，你可能很容易在自然中得到满足感，我现在做的生活，\n\n要不然我可能不会写这个什么不消费的分享，但现在我巴拉讲完了，大家再问我问题，我就能把 ppt 做出来。我之后根据这个总结，我就能写一篇文章。这件事情它是我可以设计一些条件，让它更容易发生，还有可能会发现有些东西如果我想做，过了好久我没做，说明我可能没那么想。我以为我想，我其实不想，它肯定中间有很多东西，所以现在所有的行动，你在做的时候都没有觉得有什么困难，或者说它启动起来很简单，或者说让你得到了一些正反馈，然后不断的激励你，它是一个正向的循环，然后要是有困难，你就找一些更轻松的方式，我就觉得我不想拉人进群，我要做这个事，我就找人拉，找人拉进群，我一定会找一些怎么能让我更愿意干这个事，这是可以研究的，我觉得它是会越来越顺的，就我觉得我。"},{"id":19,"layout":"section","group":1,"title":"具体怎么生活？","subtitle":"住宿 · 食物 · 物品 · 交通 · 体验","items":[],"accent":"blue","origin":"personal","narration":"然后我看一下还有什么，那我讲一些具体的吧，具体的不花钱，有什么各种各想法。\n\n我最开始！这些是大家问的问题，我把它整理了，也不是我整理的 ai 整理了一下 ppt，然后我就惠按也不是按顺序按照一些组织来。来回答他，我最开始走上这个路，是因为我很穷，我在留学的时候非常的穷困，觉得一切东西都非常的贵，非常的诡异，"},{"id":20,"layout":"story","group":1,"title":"最初，因为没钱\n我去尝试打工换宿","subtitle":"从自己的经历开始","items":[["英国农场","包吃包住；喂小羊、散步，也参与当地的生活。"],["第一次发现","原来即使钱很少，也能度过一段满足的日子。"]],"origin":"personal","narration":"然后我看一下还有什么，那我讲一些具体的吧，具体的不花钱，有什么各种各想法。\n\n我最开始！这些是大家问的问题，我把它整理了，也不是我整理的 ai 整理了一下 ppt，然后我就惠按也不是按顺序按照一些组织来。来回答他，我最开始走上这个路，是因为我很穷，我在留学的时候非常的穷困，觉得一切东西都非常的贵，非常的诡异，\n\n我可能先发现了一个免费的拿超市里过期的菜的 app，然后对到时间打折，他们是比如说当天到期他们会有那个。他们可以有人去收回来，然后就能得到很多吃的，它是全免费的，他先贴了条，说这个降降价实在还卖不出去，他们就会交给组织，这个组织就会把它分发出来，你就可以用这种 app 拿，然后。然后后面我是去打工换宿，打工换宿，我觉得对我来说最开始也是我发现有选项，然后我去尝试，我很喜欢这种方式，因为我在国外的时候，它会让我认识很多当地的社群。我饭认识当地人，然后我饭跟当地人一起吃饭，我可能会见那些当地人的朋友，我饭知道他每天在干嘛，我就会了解更了解国家或者更了解一部分人群，我发现是我喜欢的，现在我的很多的，我觉得我的旅行我一直在不同的变地方，也是在看，我在这个地方我能获得什么，我能提供什么？你也在做一种参与式的，我想要参与到当地的事情里面，和当地发生联系的这样的事情，可能我在做了几次打工，\n\n打工换宿之后我发现，原来这个事情。原来好像我的食宿我之前我在一个农场，在英国农场，然后包吃包住就住很好的房子，它是一个巨大的大 house，一个维多利亚式的 house，然后。你住一个巨大的床，外面你可以看到外面的小羊在走，你每天的工作下楼喂一下小羊，然后散散步，生活就非常的满足它，首先你吃住都不需要，然后你的整个生活很健康，你每天都在吃有机食品，然后再吃那些跑来跑去小羊，小牛的肉，然后也很好吃，你就每天吃的很饱。你就惠觉得，原来这样好像也能活，发现，原来就算我什么都没有，我可能也能度过一样，这样的时期他不一定说我要永远这样过下去，但我知道，原来人在社会上生存是没有那么难的。然后等到后面我发现，我可以创造一些自己的选项，就我从后面到了苏格兰，然后开始也是在打工换宿的平台上找的，后面他们不需要这个岗位了，于是，我和当地的就我的 host 相处的很好，\n\n他就把我拉到老奶奶家。他说老奶奶家有个空房间，你可以住空房间，我们就一起把空房间整理出来，我就会去给老奶奶的公园拔一拔草，然后我就发现，原来选项是可以自己创造的，你可以敲门问他需不需要的，他有可能是需要的，或者这对他来说，他没有增加很多的负担，因为他那个房间本来就是空着，然后堆满了杂物，然后有人帮他拔草，然后跟他说话，然后我还跟他一起去什么织毛衣，一个很小的村子里面，然后一堆老年人在那织毛线，我参加活动，我也觉得很有意思，我就发现，原来选项是可以自己创造的，慢慢的我就发现，好像有很多这样的选项存在，我不需要去找现成的平台，有一个现成的 contract 就是条款，是什么样的，我可以自己去创造一些我自己的选项。大概就是慢慢的这样变的，然后最初想要不消费就肯定是因为穷，然后现在的生活肯定是更幸福了，因为像我刚才说的，它会积累更多的选项，本来我可能只是住宿免费，我现在就是我走的多了，"},{"id":21,"layout":"story","group":1,"title":"一个空房间，\n变成了新的住宿选项","subtitle":"苏格兰的小村子","items":[["原来的岗位不再需要人","相处很好的 host，把我介绍到当地老奶奶家。"],["一起整理空房间","我住下来，也帮忙拔草、聊天、参加织毛线的活动。"]],"origin":"personal","narration":"打工换宿之后我发现，原来这个事情。原来好像我的食宿我之前我在一个农场，在英国农场，然后包吃包住就住很好的房子，它是一个巨大的大 house，一个维多利亚式的 house，然后。你住一个巨大的床，外面你可以看到外面的小羊在走，你每天的工作下楼喂一下小羊，然后散散步，生活就非常的满足它，首先你吃住都不需要，然后你的整个生活很健康，你每天都在吃有机食品，然后再吃那些跑来跑去小羊，小牛的肉，然后也很好吃，你就每天吃的很饱。你就惠觉得，原来这样好像也能活，发现，原来就算我什么都没有，我可能也能度过一样，这样的时期他不一定说我要永远这样过下去，但我知道，原来人在社会上生存是没有那么难的。然后等到后面我发现，我可以创造一些自己的选项，就我从后面到了苏格兰，然后开始也是在打工换宿的平台上找的，后面他们不需要这个岗位了，于是，我和当地的就我的 host 相处的很好，\n\n他就把我拉到老奶奶家。他说老奶奶家有个空房间，你可以住空房间，我们就一起把空房间整理出来，我就会去给老奶奶的公园拔一拔草，然后我就发现，原来选项是可以自己创造的，你可以敲门问他需不需要的，他有可能是需要的，或者这对他来说，他没有增加很多的负担，因为他那个房间本来就是空着，然后堆满了杂物，然后有人帮他拔草，然后跟他说话，然后我还跟他一起去什么织毛衣，一个很小的村子里面，然后一堆老年人在那织毛线，我参加活动，我也觉得很有意思，我就发现，原来选项是可以自己创造的，慢慢的我就发现，好像有很多这样的选项存在，我不需要去找现成的平台，有一个现成的 contract 就是条款，是什么样的，我可以自己去创造一些我自己的选项。大概就是慢慢的这样变的，然后最初想要不消费就肯定是因为穷，然后现在的生活肯定是更幸福了，因为像我刚才说的，它会积累更多的选项，本来我可能只是住宿免费，我现在就是我走的多了，\n\n我建立了一种我就是很喜欢蹭蹭吃蹭喝的形象。就大家都惠给我提供蹭吃蹭喝的选项，我要离开农场那场猪也说你下次回来我再给你包一个交通，大家惠慢慢的给我提供更多的选项，然后他们惠知道，原来我这样的。"},{"id":22,"layout":"statement","group":1,"title":"选项，\n可以自己创造","subtitle":"不一定要先有一个平台、一份现成的条款","items":[],"accent":"yellow","origin":"personal","narration":"他就把我拉到 去吧，所以我这次在上海住，我带。就我拎了一箱什么洗碗洗洁精，然后洗什么东西，然后谁给我地方，我把东西给他，然后我去你家住，我就家里有很多，然后什么精华什么的，我爷爷奶奶这种东西也送不出去，雅诗兰黛他们给谁送，然后我就送给你了，"},{"id":28,"layout":"story","group":1,"title":"一件毛衣，一件外套","subtitle":"需要的时候穿，不需要的时候继续流动","items":[["在上海做分享","觉得冷，从空间旁的二手商店拿到毛衣，用活动回馈来交换。"],["在福建山上露营","从乡里的衣物捐赠点拿外套，下山后再还回去。"]],"origin":"personal","narration":"就有一次我夏天，我冬天过年的时候去了大理，然后去了大理之后我就去了东南亚，那个时候我箱子里全是冬天的衣服，然后夏天的衣服我是要现找的。我就带了一个空箱子去了东南亚，那个时候我就在就是也是在社区里面问有没有人有冬天的，有没有夏天的衣服，我先拿了一点，然后后面刚好也是很机缘巧合，\n\n我碰到和尚，他跟我一起去，他带了两大包衣服，为了去捐给老挝村里面的孩子，然后我也得到了几件。我就是一路一路看有没有可能得到一些，我就装满了，我现在到一个地方，我可能会，我带的东西是非常少的，当我需要什么，这件毛衣。我现在有点热，这件毛衣是我去上海一个空间做分享的时候，我觉得太太太冷了，他们旁边刚好有一个二手的超市，我就拿了一件毛衣穿，后面就说我下次就是。我因为活动，然后他本来说要请我喝一杯咖啡请我吃顿饭，我说你就把毛衣给我，我就把毛衣拿回来，穿了后面两天天又热了，我又不穿了，我可能就会想把毛衣还回去。就大概，\n\n我这次在露营在福建那边，露营突然有个露营活动，山上非常冷，他们下面也有一个超市，你们有免费的衣服可以捐到那边去，福建的，乡里面，它有好多你要捐衣服可以捐到那里，我发现衣服是很不好捐的，现在大家都不想要，都不想要衣服了，家里的衣服都很难处理掉。然后我就去拿了一件外套，然后当我下山了，我就再把外套还回去，\n\n很多时候我去一个城市，我去城市，我可能会问周围的人，你们有没有不要的衣服，比如说有朋友，他就会把家里的他发现他根本不要穿的衣服再给我，我跟他说衣服我可能不会带走，我可以保证他会得到某种安置，我可能就会再想办法。我离开城市的时候，我就会把这些东西再送掉。\n\n我作为一个经常迁徙的人，我是基本上没有什么我占有的物品的，我觉得一个物品它只要享受就可以，我能享受到它的价值。因为我之前一直在流动，我就经常不在我那个老家，我从小在的家里面，我回到家就发现有很多10年20年前的东西还在那边，他们名义上是我的，所以奶奶也不会动，他们那些书也没有人看，然后所有东西都没有人使用，这些物品完全就是放在那儿，不知道在干嘛，那我后面就把所有东西都送掉了。我发现根据我的经验，他们并没有被使用到。我再早之前开始到处跑的时候就各个地方跑，我就东西就惠越丢越少，我可能开始拎了两个箱子，发现这两个箱子基本上我有些东西根本就不惠碰，可能意味着我下次就不需要带它，我的东西就会开始有点被迫有一些拎不动，或者有些超重，我就没办法带着它，就惠越来越少。我发现我的生活必需品越来越少。后面我就发现这个世界上所有的资源我都是可以用得到的，如果我需要，我就可以找途径去获得它，那我就不需要去购买它。然后大概是这样，"},{"id":29,"layout":"statement","group":1,"title":"享受一个物品的价值，\n不一定要一直拥有它","subtitle":"到一个地方，寻找当下需要的东西；离开时，给它新的安置","items":[],"accent":"green","origin":"personal","narration":"就有一次我夏天，我冬天过年的时候去了大理，然后去了大理之后我就去了东南亚，那个时候我箱子里全是冬天的衣服，然后夏天的衣服我是要现找的。我就带了一个空箱子去了东南亚，那个时候我就在就是也是在社区里面问有没有人有冬天的，有没有夏天的衣服，我先拿了一点，然后后面刚好也是很机缘巧合，\n\n我碰到和尚，他跟我一起去，他带了两大包衣服，为了去捐给老挝村里面的孩子，然后我也得到了几件。我就是一路一路看有没有可能得到一些，我就装满了，我现在到一个地方，我可能会，我带的东西是非常少的，当我需要什么，这件毛衣。我现在有点热，这件毛衣是我去上海一个空间做分享的时候，我觉得太太太冷了，他们旁边刚好有一个二手的超市，我就拿了一件毛衣穿，后面就说我下次就是。我因为活动，然后他本来说要请我喝一杯咖啡请我吃顿饭，我说你就把毛衣给我，我就把毛衣拿回来，穿了后面两天天又热了，我又不穿了，我可能就会想把毛衣还回去。就大概，\n\n我 房子，或者是你买的房子。这些也许是可以尝试的。然后大家提供了很多，然后俏也为啥选择离开家，这是什么问题？我没懂，可能我就是喜欢出去玩儿，这是我发现的。然后有没有什么具体的问题，具体的不花钱要怎么生活，有没有什么例子是？有可能大家好奇的。如果没有我就先往后讲。\n\n还有一部分我经常愿经常被被问到的。我还看纸质书吗？我不看纸质书，我不看书，我这个人不看书，然后那你每天在群里面分享那么多自己看的东西。我那也不是书哈，我想问，你上次留在家给我的礼物是哪来的？我家里给的不需要这些东西，你不需要了，我在，不是精华什么的吗？"},{"id":31,"layout":"rows","group":1,"title":"活动和课程，可以通过参与获得","subtitle":"先认可人和事情，再看自己能提供什么","items":[["提供帮助","协助传播、分享体验，或参与运营。"],["用分享交换","在城市做分享，也收到演出票、攀岩体验等回馈。"],["先付费，也可以","先体验、认识彼此，之后再寻找参与和合作的可能。"]],"origin":"personal","narration":"我可能就会做一个分享会，然后这分享会比如说在上海它肯定是收费的，如果你你可以不交这个钱，我们可以吃一顿饭，我们可以一起发现一个选项，我在上海做分享会，可能就有人给了我什么一人一故事的票，然后。给了我很多上海的文娱活动，他们在做活动，他们在参与一个事情，他们有渠道去得到邀请票之类的，他们可以给我。比如说有人参加上海的市民夜校什么脱口秀的，反正有很多这样的东西，然后他就惠说那能不能，能不能，能不能，能不能用来换或者去攀岩的门票，就我也没有攀过岩，有一个人惠跟我一起去攀岩，付我的门票，然后教我怎么攀岩，就基本上这样，\n\n我惠打开城市的很多大家。大家在城市做什么的选项和知道，能认识一些当地城市的地区的人，这个是我一般进入一个城市的方式，我可能会一般先找一个我熟悉的地方先。就我熟悉的社区或者什么住一阵，也许我就会在这个地方认识更多的选项，然后日用品和其他用品，我觉得在社区就是 low low 价就蛮多的，我每次去一个地方，会自己买一些，然后买了之后我以前是不买的，后面我还是自己买了之后我就会留在社区，就发现这样好像也是行的，我看聊天有人给，也是真的有很多这样的剩余的东西存在，只要你愿意去找一找和，只要你愿意去开放的说，我想要东西，就会有很多人提供这样的选项。然后像收费的活动和课程就是我是很多有人惠邀请我说能不能，比如说我最近参加的，我帮他们转发一下东西，我参加完分享一下我的体验，然后或者是有的是让我帮忙运营一下什么东西，只要是我想参加的，他肯定是我，首先我认可人和认可他教的东西，我就愿意帮他去看一下我能为你创造什么样的价值。\n\n所以一般来说，一般来说，你可能在完全不认识那个人的时候，你可以先付费第一次，然后后面你认识了之后，你们就能发生很多的互动，可能就能后面的你都可以以某种方式去参与和合作。\n\n然后我看有人问的是啥，心理上怎么一道坎儿，主要是那你就吃新鲜的，就是你你你觉得你不想去垃圾桶捡吃的，那你就不去垃圾桶捡吃的，这有什么好说的，你你不想吃就不用这个选项，你就找点别的选项，你要为自己创造一个选项，你不能听选项，我在说有可能是可以的，那你就去超市找新鲜的菜。要么我就是拿家里的购物卡。我觉得长期在家就还是非常合适，像我的流动，反而我觉得不太方便，在家你就在厨房里你就，你就可以在阳台种一点地，你可以跟你的邻居建立一个交换的网络。然后你就能跟周围建立更长期的关系，你能在小区门口摆一个就医的点，你就可以发现，当地有什么 charity shop，我觉得在家生活反而是更稳定的一个选项。"},{"id":32,"layout":"rows","group":1,"title":"交通，也可以和做事连在一起","subtitle":"去一个地方，看看我能在那里创造什么价值","items":[["活动邀请","受邀去做分享、参与事情时，由邀请方承担交通。"],["已有合作","农场等合作方，愿意为下一次参与提供交通支持。"],["众筹","说明自己想做的事情，以及能为支持者带来什么。"]],"origin":"personal","narration":"我今天主要想讲的是我在不消费方向的实践，比如说我一身衣，一身的衣服，都不是，都不是我买的，比如说是我在合作社换的，比如说这边有露露架，然后有，然后有一些像慈善超市之类的，然后什么这个是我妈买的，我的头发是免费染的，因为有一些。因为有一些小红书上搜你们搜免费染发就能搜到很多，他们有的惠，想找什么，想找，想找他给你拍几张照，一个刚刚新来的，他需要一些染发的案例，他就会免费染发烫发，比如说我的，反正我的袜子是朋友给的，我能想到所有的各种物品，我是，都可以通过各种途径来获得，比如说我今天来这里的车票，我还买了个一等座，然后交通是报销的，然后这边住宿因为这边有活动，它的食宿也是包的。我在上一个地方也是食宿是包的，然后交通也是包的，大概我不花钱住宿已经有三年，三年，三年半，三年。多一点的时间，慢慢我发现我的吃饭，交通还有我的各种用的东西，就大家问了很多，就什么什么东西是怎么获得的，\n\n我建立了一种我就是很喜欢蹭蹭吃蹭喝的形象。就大家都惠给我提供蹭吃蹭喝的选项，我要离开农场那场猪也说你下次回来我再给你包一个交通，大家惠慢慢的给我提供更多的选项，然后他们惠知道，原来我这样的。\n\n交通我现在报销这个老板给我报销，有很多，比如说活动，是邀请我去的，我可能报销，然后这个医疗就医医疗，它现在医疗也给我报销，我还是能发现越来越多，就跟我众筹腾讯会议一样，我现在觉得我要去哪儿，我可以考虑众筹。众筹我可以告诉你其他人我能给你什么东西，如果这个地方真的召唤，我让我想看，比如说今年年初有一个数字人民大会，我就我不想去，然后我就跟有些人说你报销机票我就去，有的人说就可以，我还是不想去，可能多找找有没有机会。看你能在那创造什么价值，"},{"id":33,"layout":"columns","group":1,"title":"长期在家，\n也可以创造这些选项","subtitle":"稳定的关系，能够慢慢积累","items":[["邻里与日常","阳台种菜、共享物品、和邻居建立交换网络。"],["照料与家庭","家长互相带孩子；儿童用品在不同年龄的家庭之间流动。"]],"origin":"personal","narration":"然后我看有人问的是啥，心理上怎么一道坎儿，主要是那你就吃新鲜的，就是你你你觉得你不想去垃圾桶捡吃的，那你就不去垃圾桶捡吃的，这有什么好说的，你你不想吃就不用这个选项，你就找点别的选项，你要为自己创造一个选项，你不能听选项，我在说有可能是可以的，那你就去超市找新鲜的菜。要么我就是拿家里的购物卡。我觉得长期在家就还是非常合适，像我的流动，反而我觉得不太方便，在家你就在厨房里你就，你就可以在阳台种一点地，你可以跟你的邻居建立一个交换的网络。然后你就能跟周围建立更长期的关系，你能在小区门口摆一个就医的点，你就可以发现，当地有什么 charity shop，我觉得在家生活反而是更稳定的一个选项。\n\n如果是老人孩子，可能你要去想，有什么选项可以创造，比如说上次我分享有个妈妈就非常激动，她就经常是其他妈妈，会把孩子放到她家来带，然后她就给小孩子上课上的特别好，然后她就特别喜欢那些家长就会带，比如说一点米一点油，然后去她家，如果有一个公司邀请她去开一个课，她就不喜欢，公司非常高级，那课非常高级，她就不喜欢她就想，我们是可以把这些物品聚集起来的，我觉得特别是孩子的东西是非常的。容易被替换的你你5岁孩子东西就可以给下一波正在5岁的孩子，然后你你们有一可以有一个非常大的网络去交换这些东西，你们有非常多的。工作量，然后要去互相提供帮助，还有一个什么行李，行李就经常迁徙，\n\n我现在的心得是我惠发现每一个地方都是我的。我都可以当做我的家，因为它的设施应该都是齐全的，但是我不知道，对你的生活来说，可能有一些东西你觉得是必备的，但是对我来说，我好像也是从一次经历开始发现。"},{"id":34,"layout":"section","group":2,"title":"不好意思开口，\n怎么办？","subtitle":"从与一个真实的人交流开始","items":[],"accent":"pink","origin":"personal","narration":"财富可能暂时没有以金钱的方式体现，但他们已经在那儿了。我有需要，比如说后面的活动，我必须要收费，我一场收多少钱，我觉得我也能收到，我可能可以不这样做，它是一种你积累的都是这些财富，然后。它是一种它，它是你不断的在花你的时间和精力就会得到的，指他是不是钱，是另外一码事，所以，我觉得好像刚才有些问题，关于。其他，还有一个我经常被问到的部分，很难开口怎么办，为什么很难开口，或者说，惠觉得好像我在要一个东西。惠觉得这个药是很羞耻的，我觉得这一方面它有很多的社会因素，我们被教导我们要独立，我们要赚钱，我们要获得自己要的一些东西，然后要不然。一些白嫖，然后占小便宜，然后什么乱七八糟的，然后我是在，对我来说有几个比较重要的点是，一个，\n\n比如说我看红姐就发现一个人的剩饭，他真的很想处理掉他，不想他不想直接把它扔掉，一个人旧的东西，他其实是想处理掉，不想扔掉。一些大城市，\n\n他们装修的这个装修，或者被废弃的一些大型的家具什么的，他们处理掉要花钱，有人能把它搬走，是一件很好的事情，有人能不花钱的把它搬走，是一件很好的事情。所以有一些东西可能对于那个人来说，你拿走它是一件好事，但到底是不是你得跟他确认，如果你觉得，我是不是占你便宜，你得跟他确认，我不知道你有没有占他便宜，你得去和一个真实的人交流，你们在交流中会知道彼此的需求是什么样的，然后还有。然后还有我在老挝的时候看他们布施，布施的时候下面的人就会举着，然后那僧人就会拿，他拿了之后旁边的人可能就会举个袋子，那个僧人就会把饭扔到袋子里，那个人就觉得，我需要饭。所以我就发现他们是一种很自然的交流，我需要我就给一点儿，如果我想要我就拿一点，它是一种资源的互换，然后对我来说，我觉得我在更大的范围内，我觉得我是在给外界提供很多东西的，我可能不是拿了 a 的，我就还给 a，但是我拿了 a 的，我可能会还给 b，"},{"id":35,"layout":"columns","group":2,"title":"愿意给，却不好意思拿","subtitle":"循环也会断在没有人接受","items":[["我愿意给","我能做什么？我有什么可以分享？"],["我不敢要","会不会麻烦别人？我能不能不花钱获得帮助？"]],"origin":"personal","narration":"财富可能暂时没有以金钱的方式体现，但他们已经在那儿了。我有需要，比如说后面的活动，我必须要收费，我一场收多少钱，我觉得我也能收到，我可能可以不这样做，它是一种你积累的都是这些财富，然后。它是一种它，它是你不断的在花你的时间和精力就会得到的，指他是不是钱，是另外一码事，所以，我觉得好像刚才有些问题，关于。其他，还有一个我经常被问到的部分，很难开口怎么办，为什么很难开口，或者说，惠觉得好像我在要一个东西。惠觉得这个药是很羞耻的，我觉得这一方面它有很多的社会因素，我们被教导我们要独立，我们要赚钱，我们要获得自己要的一些东西，然后要不然。一些白嫖，然后占小便宜，然后什么乱七八糟的，然后我是在，对我来说有几个比较重要的点是，一个，\n\n比如说我看红姐就发现一个人的剩饭，他真的很想处理掉他，不想他不想直接把它扔掉，一个人旧的东西，他其实是想处理掉，不想扔掉。一些大城市，\n\n他们装修的这个装修，或者被废弃的一些大型的家具什么的，他们处理掉要花钱，有人能把它搬走，是一件很好的事情，有人能不花钱的把它搬走，是一件很好的事情。所以有一些东西可能对于那个人来说，你拿走它是一件好事，但到底是不是你得跟他确认，如果你觉得，我是不是占你便宜，你得跟他确认，我不知道你有没有占他便宜，你得去和一个真实的人交流，你们在交流中会知道彼此的需求是什么样的，然后还有。然后还有我在老挝的时候看他们布施，布施的时候下面的人就会举着，然后那僧人就会拿，他拿了之后旁边的人可能就会举个袋子，那个僧人就会把饭扔到袋子里，那个人就觉得，我需要饭。所以我就发现他们是一种很自然的交流，我需要我就给一点儿，如果我想要我就拿一点，它是一种资源的互换，然后对我来说，我觉得我在更大的范围内，我觉得我是在给外界提供很多东西的，我可能不是拿了 a 的，我就还给 a，但是我拿了 a 的，我可能会还给 b，\n\n我到了一个地方，我先拿了一堆东西，然后之后我惠把这些东西再，再放在哪里去继续的交流。所有的资源它会流经我，这个流经的过程会让资源越来越丰富，还有一个是我发现海德玛丽在写，她做交换权，她发现，说自己能给什么的人要远比他们说要自己要什么的人要多，就大家都愿意给而不愿意拿，可能因为觉得拿可能是一种，觉得自己是更弱的，然后觉得自己是更什么什么的，我觉得还是那一套，我们因为链条而带来的一些价值体系。就不管怎么样，你可以先尝试，\n\n我之前有个朋友听了我的分享，他就路过了一家店，然后他们在做生日蛋糕，他就问说你们生日蛋糕是干嘛的，他说，明天有人过生日，他说，我来可以参加你们的生日吗？我给你们唱个生日歌，我觉得这也可以算一种一个人能给的东西，一些你可能就碰到一个商家，你也会。你也惠讨价还价一下，但也不是因为你穷，你就跟他讨价还价一下，这也没有什么关系。所以很多时候我们因为金钱是一种比较。明确的标的物，我们可以直接去买东西，或者直接卖东西，他好像就你不需要 care 这些，也许卖给你这个人他心里也不平衡。\n\n很多人愿意登记自己能给什么，却不敢提出自己的需要。我们还可能默认有成本的服务只能用钱买，不会想到在社区里寻求别的交换方式。没有人接受，循环也会断掉。"},{"id":36,"layout":"story","group":2,"title":"你拿走它，\n也可能是在帮忙","subtitle":"富余物品，对拥有它的人不一定还是资源","items":[["想处理，又不想丢掉","吃不完的食物、不用的物品，甚至处理要花钱的家具。"],["到底是不是占便宜？","和对方确认；只有真实交流，才知道彼此需要什么。"]],"origin":"personal","narration":"比如说我看红姐就发现一个人的剩饭，他真的很想处理掉他，不想他不想直接把它扔掉，一个人旧的东西，他其实是想处理掉，不想扔掉。一些大城市，\n\n他们装修的这个装修，或者被废弃的一些大型的家具什么的，他们处理掉要花钱，有人能把它搬走，是一件很好的事情，有人能不花钱的把它搬走，是一件很好的事情。所以有一些东西可能对于那个人来说，你拿走它是一件好事，但到底是不是你得跟他确认，如果你觉得，我是不是占你便宜，你得跟他确认，我不知道你有没有占他便宜，你得去和一个真实的人交流，你们在交流中会知道彼此的需求是什么样的，然后还有。然后还有我在老挝的时候看他们布施，布施的时候下面的人就会举着，然后那僧人就会拿，他拿了之后旁边的人可能就会举个袋子，那个僧人就会把饭扔到袋子里，那个人就觉得，我需要饭。所以我就发现他们是一种很自然的交流，我需要我就给一点儿，如果我想要我就拿一点，它是一种资源的互换，然后对我来说，我觉得我在更大的范围内，我觉得我是在给外界提供很多东西的，我可能不是拿了 a 的，我就还给 a，但是我拿了 a 的，我可能会还给 b，\n\n我到了一个地方，我先拿了一堆东西，然后之后我惠把这些东西再，再放在哪里去继续的交流。所有的资源它会流经我，这个流经的过程会让资源越来越丰富，还有一个是我发现海德玛丽在写，她做交换权，她发现，说自己能给什么的人要远比他们说要自己要什么的人要多，就大家都愿意给而不愿意拿，可能因为觉得拿可能是一种，觉得自己是更弱的，然后觉得自己是更什么什么的，我觉得还是那一套，我们因为链条而带来的一些价值体系。就不管怎么样，你可以先尝试，"},{"id":37,"layout":"question","group":2,"title":"愿意给的人，\n也需要有人能够接受","subtitle":"大家都愿意给，却不愿意拿，流动就难以继续","items":[],"origin":"personal","narration":"我到了一个地方，我先拿了一堆东西，然后之后我惠把这些东西再，再放在哪里去继续的交流。所有的资源它会流经我，这个流经的过程会让资源越来越丰富，还有一个是我发现海德玛丽在写，她做交换权，她发现，说自己能给什么的人要远比他们说要自己要什么的人要多，就大家都愿意给而不愿意拿，可能因为觉得拿可能是一种，觉得自己是更弱的，然后觉得自己是更什么什么的，我觉得还是那一套，我们因为链条而带来的一些价值体系。就不管怎么样，你可以先尝试，\n\n我之前有个朋友听了我的分享，他就路过了一家店，然后他们在做生日蛋糕，他就问说你们生日蛋糕是干嘛的，他说，明天有人过生日，他说，我来可以参加你们的生日吗？我给你们唱个生日歌，我觉得这也可以算一种一个人能给的东西，一些你可能就碰到一个商家，你也会。你也惠讨价还价一下，但也不是因为你穷，你就跟他讨价还价一下，这也没有什么关系。所以很多时候我们因为金钱是一种比较。明确的标的物，我们可以直接去买东西，或者直接卖东西，他好像就你不需要 care 这些，也许卖给你这个人他心里也不平衡。"},{"id":38,"layout":"statement","group":2,"title":"我拿了 A 的，\n也可能还给 B","subtitle":"资源流经我，再继续流向别处","items":[],"accent":"blue","origin":"personal","narration":"他们装修的这个装修，或者被废弃的一些大型的家具什么的，他们处理掉要花钱，有人能把它搬走，是一件很好的事情，有人能不花钱的把它搬走，是一件很好的事情。所以有一些东西可能对于那个人来说，你拿走它是一件好事，但到底是不是你得跟他确认，如果你觉得，我是不是占你便宜，你得跟他确认，我不知道你有没有占他便宜，你得去和一个真实的人交流，你们在交流中会知道彼此的需求是什么样的，然后还有。然后还有我在老挝的时候看他们布施，布施的时候下面的人就会举着，然后那僧人就会拿，他拿了之后旁边的人可能就会举个袋子，那个僧人就会把饭扔到袋子里，那个人就觉得，我需要饭。所以我就发现他们是一种很自然的交流，我需要我就给一点儿，如果我想要我就拿一点，它是一种资源的互换，然后对我来说，我觉得我在更大的范围内，我觉得我是在给外界提供很多东西的，我可能不是拿了 a 的，我就还给 a，但是我拿了 a 的，我可能会还给 b，\n\n我到了一个地方，我先拿了一堆东西，然后之后我惠把这些东西再，再放在哪里去继续的交流。所有的资源它会流经我，这个流经的过程会让资源越来越丰富，还有一个是我发现海德玛丽在写，她做交换权，她发现，说自己能给什么的人要远比他们说要自己要什么的人要多，就大家都愿意给而不愿意拿，可能因为觉得拿可能是一种，觉得自己是更弱的，然后觉得自己是更什么什么的，我觉得还是那一套，我们因为链条而带来的一些价值体系。就不管怎么样，你可以先尝试，"},{"id":39,"layout":"story","group":2,"title":"你给我住宿，\n我能为你做些什么？","subtitle":"用交换代替购买","items":[["一起找到认可的方案","有时候是举手之劳，有时候是更具体的参与"]],"origin":"personal","narration":"然后我在讲所有的这些东西，我觉得我的理念，首先你关心你自己，你认识到你自己是什么，然后你跟你周围建立一些有意义的关系，它不一定说你要有很多朋友，你会比如说我刚才说跟物品建立有意义的关系，你想和你的物品。你很喜欢你的东西，你不会很容易的就丢弃它，你可能会跟周围的人建立关系，你会想我们能一起做什么事情，这个是我，我发现我在幻宿在各种，去寻找一个。我的幻速，我并不惠认为一种打工，而是因为我很喜欢你的这个地方，然后我很认可你的理念，所以我要来帮你跟你一起做这件事情，我一定喜欢我才惠来问你，然后在你在我跟你说和你拒绝我，或者你说不行，或者你说，但是我需要什么什么的时候，我知道你的需求是什么，我就知道，原来你是你想要的是，那我怎么能够和你一起来抵达，我怎么能够和你共同创造一个，我们都觉得东西是好的，我能不能贡献我的力量？因为我觉得我的力量是很值钱的，然后我并不会很容易卖它，但是我也并不会经常用去用它来获得钱。\n\n接下来就是我们这个社会，我们怎么创造价值，或者我们赚怎么赚钱，在我的概念里面，我是不会做，\n\n我不喜欢做的事情，就有些事情我觉得，不是我做的，我就惠想办法把它交给别人，比如说，比如说这个群我不想加大家好友拉大家进群，我愿意加大家好友，我不想点开那个群，然后把人拉进去，工作我不会做，比如说刚才我在这边我也寻求了很多帮助，帮我把臀椅打开，但是我不想在我电脑上投屏，因为我要专注在我现在要的分享上，我会去区分哪些是做哪些不想做的，我会专注在我想做那个事情上，然后我相信它能创造价值，它能够给周围的其他人带来价值，我觉得是跟社会的联系。然后再远一点跟自然的联系，它是他是非常怎么说，它是不太变动的东西，它是一个非常稳定的东西。你跟自然有联系，你感觉这一切，焦虑都没有那么重大，一些人类社会的焦虑，它其实也都没有那么重大，你可能很容易在自然中得到满足感，我现在做的生活，\n\n我长期获得免费住宿，也会留意我能提供什么。如果还没有足够的信任，我们能不能找到一个大家都认可的交换方案？交换也可以在相处中慢慢长出来。"},{"id":40,"layout":"rows","group":2,"title":"不知道能提供什么，就慢慢试","subtitle":"价值是在参与和反馈里发现的","items":[["从具体的小事开始","陪伴、唱一首歌、帮忙做一件当下需要的事。"],["听别人问什么","农场主来问 AI 的问题，我才看见自己能提供这方面的帮助。"],["一起商量","对方不需要这个，也可以问：你还需要什么？"]],"origin":"personal","narration":"我之前有个朋友听了我的分享，他就路过了一家店，然后他们在做生日蛋糕，他就问说你们生日蛋糕是干嘛的，他说，明天有人过生日，他说，我来可以参加你们的生日吗？我给你们唱个生日歌，我觉得这也可以算一种一个人能给的东西，一些你可能就碰到一个商家，你也会。你也惠讨价还价一下，但也不是因为你穷，你就跟他讨价还价一下，这也没有什么关系。所以很多时候我们因为金钱是一种比较。明确的标的物，我们可以直接去买东西，或者直接卖东西，他好像就你不需要 care 这些，也许卖给你这个人他心里也不平衡。\n\n东西我很贵，买的我卖给你非常的难过，这些难受也存在，只是你好像因为有了钱，你们这个交易就清清掉了。就不管怎么样，你跟人接触，你们就会发生这样的，这样的事情，有可能你们两个都达成了交易，你们达成了非货币的交易，他回头觉得，你占我便宜了，也有可能就比如说有。\n\n对我来说我的标准是我不干我不喜欢的事情，如果我干一个不喜欢我，我不喜欢的事情，比如说我要给你剪辑视频，我觉得，我这方面做得很好，我来给你提供帮助，做着我就可能觉得，这个事情我还是觉得心里觉得很难受，但因为我又已经答应你了。\n\n我可能就惠在这卡着，我可能惠觉得，这个东西是要钱的，我怎么能不要钱给你？可能惠有心理的不平衡，然后对我来说，我一定要喜欢这个事情，我们一定是互相符合价值观的，我才惠愿意跟你做，我不会随便找一个换宿，我要在这边找免费，他说可以免费，然后我觉得，我一定就能，我能跟他换宿，我觉得这是另外一回事，这样你就不会被，你不会在这个过程中觉得，我变成弱势的一方，我是在为他打工，我在用我的时间和精力去换取一个免费的住宿之类的。这些都还是人和人需要去碰撞，就是你知道自己要什么，然后就研究别人要什么，你去找到一个你们两个都舒适的选项，现选项不成立也没有关系，你们都进行了一些互相的了解，你们也建立了一些关系，你们互相知道一些，他可能要什么，我可能想给什么。就 ok 所以然后不知道自己能提供什么，就慢慢去试，也许你就能找到我，我现在比如说我到了，\n\n我到了农场，我就给农场主做他的 ai，他问我 ai 的事情，然后我就，我就回答他 ai 的事情，就我在很多地方，我发现可能我因为发的东西多了，我经常对外的去输出一些价值，\n\n然后别人惠问我一些相关的问题，我就发现，这个东西好像是我能给的。可能是一种方式，就这些，我觉得可能要等到你想要去的时候可以慢慢去试，因为也惠有很多人跟我来换东西，我那时候可能就会讨论说我好像不想要，你有没有可能给我这些东西，他们可能会觉得，这些可能是可以的，大概是这样。我其实没有什么困难，也没有什么这些我都讲不了，然后就这些什么聚餐，生日礼金你们自己决定就跟我没关系，你你们聚餐花钱的吃饭你愿意你就去，然后你不愿意你就不去，你也不会因为说，我最近不花钱了，你们所有人都要请我吃饭，我觉得这不太可能，所以。这些，然后我跟家人朋友没有什么影响，因为我也不是说好，我就死活都不花钱，只要花钱的活动我都不去，我也没有这样，确实我发现你是可以跟朋友创造更多不消费的选项的，"},{"id":41,"layout":"equation","group":2,"title":"我可以提供","subtitle":"我想向所有人提供","items":[],"symbol":"≠","origin":"personal","narration":"对我来说我的标准是我不干我不喜欢的事情，如果我干一个不喜欢我，我不喜欢的事情，比如说我要给你剪辑视频，我觉得，我这方面做得很好，我来给你提供帮助，做着我就可能觉得，这个事情我还是觉得心里觉得很难受，但因为我又已经答应你了。\n\n我可能就惠在这卡着，我可能惠觉得，这个东西是要钱的，我怎么能不要钱给你？可能惠有心理的不平衡，然后对我来说，我一定要喜欢这个事情，我们一定是互相符合价值观的，我才惠愿意跟你做，我不会随便找一个换宿，我要在这边找免费，他说可以免费，然后我觉得，我一定就能，我能跟他换宿，我觉得这是另外一回事，这样你就不会被，你不会在这个过程中觉得，我变成弱势的一方，我是在为他打工，我在用我的时间和精力去换取一个免费的住宿之类的。这些都还是人和人需要去碰撞，就是你知道自己要什么，然后就研究别人要什么，你去找到一个你们两个都舒适的选项，现选项不成立也没有关系，你们都进行了一些互相的了解，你们也建立了一些关系，你们互相知道一些，他可能要什么，我可能想给什么。就 ok 所以然后不知道自己能提供什么，就慢慢去试，也许你就能找到我，我现在比如说我到了，\n\n我到了农场，我就给农场主做他的 ai，他问我 ai 的事情，然后我就，我就回答他 ai 的事情，就我在很多地方，我发现可能我因为发的东西多了，我经常对外的去输出一些价值，\n\n然后别人惠问我一些相关的问题，我就发现，这个东西好像是我能给的。可能是一种方式，就这些，我觉得可能要等到你想要去的时候可以慢慢去试，因为也惠有很多人跟我来换东西，我那时候可能就会讨论说我好像不想要，你有没有可能给我这些东西，他们可能会觉得，这些可能是可以的，大概是这样。我其实没有什么困难，也没有什么这些我都讲不了，然后就这些什么聚餐，生日礼金你们自己决定就跟我没关系，你你们聚餐花钱的吃饭你愿意你就去，然后你不愿意你就不去，你也不会因为说，我最近不花钱了，你们所有人都要请我吃饭，我觉得这不太可能，所以。这些，然后我跟家人朋友没有什么影响，因为我也不是说好，我就死活都不花钱，只要花钱的活动我都不去，我也没有这样，确实我发现你是可以跟朋友创造更多不消费的选项的，\n\n我可以提供，不等于我想向所有人提供。写下一个技能或一种资源，不是在对所有人签下一份随时可以要求兑现的契约。"},{"id":42,"layout":"equation","group":2,"title":"我想要","subtitle":"谁给我，我都必须接受","items":[],"symbol":"≠","origin":"personal","narration":"对我来说我的标准是我不干我不喜欢的事情，如果我干一个不喜欢我，我不喜欢的事情，比如说我要给你剪辑视频，我觉得，我这方面做得很好，我来给你提供帮助，做着我就可能觉得，这个事情我还是觉得心里觉得很难受，但因为我又已经答应你了 生活中已有的支持","items":[["聚会与娱乐","去公园跳舞、唱歌，也能一起玩；想去餐厅聚餐，也可以去。"],["家庭与礼物","接受家人的支持、互赠礼物；是否接受，仍由自己决定。"]],"origin":"personal","narration":"对有人问家庭怎么看，我今天发完我不消费分享，我爷爷就给我打钱，他觉得我。老师我能理解为就是通过啃老来不花钱吗？啃老不花钱，我觉得也是一种手段，如果老也是你的甲方，我觉得我们每一个人都有不同的条件，你的甲方愿意给你这样的支持，然后你又同意他们的条件，如果你要找个包吃包住选项，你又能跟你家人生活在一起，不是一个很好的方式吗？\n\n然后别人惠问我一些相关的问题，我就发现，这个东西好像是我能给的。可能是一种方式，就这些，我觉得可能要等到你想要去的时候可以慢慢去试，因为也惠有很多人跟我来换东西，我那时候可能就会讨论说我好像不想要，你有没有可能给我这些东西，他们可能会觉得，这些可能是可以的，大概是这样。我其实没有什么困难，也没有什么这些我都讲不了，然后就这些什么聚餐，生日礼金你们自己决定就跟我没关系，你你们聚餐花钱的吃饭你愿意你就去，然后你不愿意你就不去，你也不会因为说，我最近不花钱了，你们所有人都要请我吃饭，我觉得这不太可能，所以。这些，然后我跟家人朋友没有什么影响，因为我也不是说好，我就死活都不花钱，只要花钱的活动我都不去，我也没有这样，确实我发现你是可以跟朋友创造更多不消费的选项的，\n\n因为很多时候我们的社交和我们的娱乐是被消费绑架的，你们去公园一起跳个舞，唱个歌，这玩意儿就不花钱，如果你们一定要去一家饭店吃饭，然后去一家 ktv 唱歌，这就要花钱。这个事情，就看着来吧，我相信就我讲的这些都是因为我们一定在生活中有过一些被包吃包住的经验，比如说被被家里人被天使夫妇资助，然后。然后你们可能都有一些互相礼物的流动，有人给你一个礼物，你给别人一个礼物，你并不是觉得我给你，你就要给我，我们生活中都会发生这样的事情，我惠觉得这个是我们生活中很重要的一部分，它不很容易的去被金钱和消费替代掉。好，就是我这一部分要讲的内容，\n\n然后我再过一下，我现在发布的我在做一个交换的圈，做了一个，它接下来可能是个小程序，因为我发现。我发现对我来说我之前都是点对点交换，比如说我去一个人住宿，我觉得诶，你给我免费住宿吧，他会同意，然后我就会想办法看我以后有没有机会能为他做点事情。有的时候我们还没有找到机会。"},{"id":45,"layout":"section","group":3,"title":"钱、时间、精力，\n怎么选择？","subtitle":"把投入放在自己认可、喜欢、愿意做的事情上","items":[],"accent":"green","origin":"personal","narration":"这个朋友的支持和孤单，我觉得也是每个人都会去为自己创造的和周围的联系，有一个我想我越来越感受到的点是我受到了很多回馈，我发现我越来越容易用非金钱的方式去获得一些我想要的东西。我觉得我好像在这个社区或者在一个一定范围内建立了很多信任，因为我投入了很多时间和精力，像金钱它就是能量的一种，比如说我们会用花钱买时间，我们想要更快的到达一个地方，我们用花钱买时间，然后或者我们用会用时间来赚钱，用时间精力来赚钱，它们都在互换的能量，它们在流转，你可以在中间，去换，\n\n你在面对一个选项的时候，你可以花钱，比如说刚才。刚才乱马说他也什么都不带，他去哪儿都买，因为他有钱，他去哪儿都觉得这个东西是可以用金钱得到的。Ok 那对我来说好像是我现在已经相信我去哪儿，我要的东西都是能。不用钱，但是我用别的资源得到，这个资源是什么？\n\n它可能是我已经积累了很多的，或者是我额外去花时间和精力，它是可以选择的。所以如果刚开始获取东西很曲折，可能是选项还没有被发现，你可以研究一下，或者等它到来，如果你觉得，现在这个选项还没有出现，那我等它，然后等它落落在我手里，也许它是一个好的时机，然后所以怎样权衡时间，什么金钱和精力，\n\n就对我来说，不管，我惠把我所有的时间，精力，金钱，就我所有的精力花在我觉得我喜欢的符合我价值的，让我觉得有意思的能给我产生更多快乐的地方，他们会在中间转换，但转换成什么就不知道，我觉得我是一个有很多财富的人。\n\n财富可能暂时没有以金钱的方式体现，但他们已经在那儿了。我有需要，比如说后面的活动，我必须要收费，我一场收多少钱，我觉得我也能收到，我可能可以不这样做，它是一种你积累的都是这些财富，然后。它是一种它，它是你不断的在花你的时间和精力就会得到的，指他是不是钱，是另外一码事，所以，我觉得好像刚才有些问题，关于。其他，还有一个我经常被问到的部分，很难开口怎么办，为什么很难开口，或 要时候，它出现在我手里了，我就知道，原来是选项给我准备好了。大概是这样，我现在有医保和社保爷爷用他们的养老金给我交我的养老金，这是他们选择的，这是他们的选择。如果是我自己我不会教的，就我发现有很多种很多的选项，我发现资源还不足够，我就不会去干事情，因为我觉得机缘还没到，他们把我逼上了这个事情我就觉得，我就干一下这个事情，所以是这样。\n\n然后我最近也在学中医，我就觉得，保持一个健康的身体和快乐的心情，保持健康的很重要的部分，小病你其实也很好，就能度过了，你去医院也花不了什么钱，你大病？另外一回事，你你就想办法，不要得大病就。我就买的是居民医保，不是居民医保，我之前买的是居民医保，买的灵活就业，医保买的最低档，我都是买的最低档，我真的不想交，然后大概是这样，\n\n我讲保险其实就是你应对风险，但是应对风险的能力，它可能你生活中有很多别的风险，比如说你的工作没了，社会崩塌，什么，然后你你就有很多很风险，然后我们是要建立韧性，然后对我来说建立韧性就创造更多的选项。所以就是很多东西，它还是你之前是通过金钱媒介去找一些服务，你可以选择不要这个媒介，你和人直接发生联系，你就能知道，你要什么我要什么，但有些东西你你确实觉得，我想花钱，那你就花钱，我没有说你不能干这个事情，你就必须把你的钱都烧掉。然后有人问说。对，有人问说缺钱没有安全感，因为我没有缺钱，所以我安全感很强，然后我也觉得我是很容易就能赚到钱的，我也知道我是很容易，我也是很容易不花钱的，所以我不会有不安全感，但所以你的安全感来源是什么？你可能得研究一下，你到底害怕什么，发生，会让你需要一笔钱，你觉得需要怎么样，所以我没有，很久没有钱了，我当时穷的账上1分钱都没有，所以我去打工换宿，后面我的钱就越来越多。然后我就不会觉得不安了？"},{"id":50,"layout":"section","group":4,"title":"从点对点的交换，\n到一个互助网络","subtitle":"让付出在更大的范围里得到回应","items":[],"accent":"yellow","origin":"personal","narration":"然后我再过一下，我现在发布的我在做一个交换的圈，做了一个，它接下来可能是个小程序，因为我发现。我发现对我来说我之前都是点对点交换，比如说我去一个人住宿，我觉得诶，你给我免费住宿吧，他会同意，然后我就会想办法看我以后有没有机会能为他做点事情。有的时候我们还没有找到机会。\n\n橄惠心里记着，我可能橄持续的关注，他可能想要什么东西，这样的事也发生过，就很多时候我们是因为它像一种礼物经济一样，我先给你，然后或者你先给我，我们之后要换什么，我们可以未来再慢慢的去感受，没有也没关系，我可能本来我这个付出就是我喜欢的。这些就是点对点的，有时候它可能就是刚好不能碰到我们都想要的点，\n\n后面我就在想，一个人提供住宿，他能不能得到一些别人给他的好处，因为他已经是在我这里认证的好人了，然后这些，这些就是我想做一个交换圈或者社区货币的原因，有人问怎么赚钱，请参加明天的活动吧，明天的活动有，然后还有，然后还有我公众号之前自我介绍也写过，\n\n总之我后面就想一个给我好东西的人，他能不能也获得一些好东西，我就想能不能把人组成网络，就有的时候，比如说我分享完的群里面就惠，有人说能不能给我，有没有人能够给我提供 a 地方的住宿，但因为他和其他人都不认识别人，跟他没有信任，说我愿意邀请你到我家来住，他没有信任的过程，他可能很难得到，\n\n他可能就会受挫，他就可能下一次不会再做这样的尝试。我想的是，我们能不能把更多的中间，我们人和人之间的流动记下来，在一个社区网络里面，我们多多少少都是有对一个人的印象的，你提到一个人，你可能会发现他和周围的人是建立了很多联系的，我们能不能把东西记下来。然后再在，在社区里面有很多隐形劳动，比如说有人倒垃圾，有人扫地，他认为是一种义务，他并不是说我要通过去获得住宿，通过来获得饭，他也是可以被看见的，他可以变成认证的好人，我觉得作为认证的好人，你得到好处，如果大家都认为你是个好人，我们都希望你有好报，即使你你只是笑得很，你笑得很灿烂，在你旁边的人都会觉得很开心，它也是一个很好的价值。我希望这种价值被看到，这就是我想做一个网络的原因，我希望请求更容易发生，因为很多时候是不一定匹配的，货币的产生，"},{"id":51,"layout":"network","group":4,"title":"这些交换，仍然绕不开我","subtitle":"我认识你，也认识他；你们之间却未必相识","items":[],"network":"hub","origin":"personal","narration":"然后我再过一下，我现在发布的我在做一个交换的圈，做了一个，它接下来可能是个小程序，因为我发现。我发现对我来说我之前都是点对点交换，比如说我去一个人住宿，我觉得诶，你给我免费住宿吧，他会同意，然后我就会想办法看我以后有没有机会能为他做点事情。有的时候我们还没有找到机会。\n\n橄惠心里记着，我可能橄持续的关注，他可能想要什么东西，这样的事也发生过，就很多时候我们是因为它像一种礼物经济一样，我先给你，然后或者你先给我，我们之后要换什么，我们可以未来再慢慢的去感受，没有也没关系，我可能本来我这个付出就是我喜欢的。这些就是点对点的，有时候它可能就是刚好不能碰到我们都想要的点，\n\n后面我就在想，一个人提供住宿，他能不能得到一些别人给他的好处，因为他已经是在我这里认证的好人了，然后这些，这些就是我想做一个交换圈或者社区货币的原因，有人问怎么赚钱，请参加明天的活动吧，明天的活动有，然后还有，然后还有我公众号之前自我介绍也写过，\n\n总之我后面就想一个给我好东西的人，他能不能也获得一些好东西，我就想能不能把人组成网络，就有的时候，比如说我分享完的群里面就惠，有人说能不能给我，有没有人能够给我提供 a 地方的住宿，但因为他和其他人都不认识别人，跟他没有信任，说我愿意邀请你到我家来住，他没有信任的过程，他可能很难得到，\n\n他可能就会受挫，他就可能下一次不会再做这样的尝试。我想的是，我们能不能把更多的中间，我们人和人之间的流动记下来，在一个社区网络里面，我们多多少少都是有对一个人的印象的，你提到一个人，你可能会发现他和周围的人是建立了很多联系的，我们能不能把东西记下来。然后再在，在社区里面有很多隐形劳动，比如说有人倒垃圾，有人扫地，他认为是一种义务，他并不是说我要通过去获得住宿，通过来获得饭，他也是可以被看见的，他可以变成认证的好人，我觉得作为认证的好人，你得到好处，如果大家都认为你是个好人，我们都希望你有好报，即使你你只是笑得很，你笑得很灿烂，在你旁边的人都会觉得很开心，它也是一个很好的价值。我希望这种价值被看到，这就是我想做一个网络的原因，我希望请求更容易发生，因为很多时候是不一定匹配的，货币的产生，\n\n我的活动、咨询都可以不付费交换，我也长期获得免费住宿。但这些关系通常只有两个人参与。我认识很多人，他们之间却未必能交换。这些关系仍然绕不开我。"},{"id":52,"layout":"dialogue","group":4,"title":"我们想交换，\n但需要没有刚好对上","subtitle":"对象、需要和时间，不一定恰好匹配","items":[["甲","我今天可以给你帮助。"],["乙","可我现在没有你需要的东西。"],["后来","以后有机会再交换——但一直没有兑现。"]],"origin":"personal","narration":"然后我再过一下，我现在发布的我在做一个交换的圈，做了一个，它接下来可能是个小程序，因为我发现。我发现对我来说我之前都是点对点交换，比如说我去一个人住宿，我觉得诶，你给我免费住宿吧，他会同意，然后我就会想办法看我以后有没有机会能为他做点事情。有的时候我们还没有找到机会。\n\n橄惠心里记着，我可能橄持续的关注，他可能想要什么东西，这样的事也发生过，就很多时候我们是因为它像一种礼物经济一样，我先给你，然后或者你先给我，我们之后要换什么，我们可以未来再慢慢的去感受，没有也没关系，我可能本来我这个付出就是我喜欢的。这些就是点对点的，有时候它可能就是刚好不能碰到我们都想要的点，\n\n后面我就在想，一个人提供住宿，他能不能得到一些别人给他的好处，因为他已经是在我这里认证的好人了，然后这些，这些就是我想做一个交换圈或者社区货币的原因，有人问怎么赚钱，请参加明天的活动吧，明天的活动有，然后还有，然后还有我公众号之前自我介绍也写过，\n\n总之我后面就想一个给我好东西的人，他能不能也获得一些好东西，我就想能不能把人组成网络，就有的时候，比如说我分享完的群里面就惠，有人说能不能给我，有没有人能够给我提供 a 地方的住宿，但因为他和其他人都不认识别人，跟他没有信任，说我愿意邀请你到我家来住，他没有信任的过程，他可能很难得到，\n\n他可能就会受挫，他就可能下一次不会再做这样的尝试。我想的是，我们能不能把更多的中间，我们人和人之间的流动记下来，在一个社区网络里面，我们多多少少都是有对一个人的印象的，你提到一个人，你可能会发现他和周围的人是建立了很多联系的，我们能不能把东西记下来。然后再在，在社区里面有很多隐形劳动，比如说有人倒垃圾，有人扫地，他认为是一种义务，他并不是说我要通过去获得住宿，通过来获得饭，他也是可以被看见的，他可以变成认证的好人，我觉得作为认证的好人，你得到好处，如果大家都认为你是个好人，我们都希望你有好报，即使你你只是笑得很，你笑得很灿烂，在你旁边的人都会觉得很开心，它也是一个很好的价值。我希望这种价值被看到，这就是我想做一个网络的原因，我希望请求更容易发生，因为很多时候是不一定匹配的，货币的产生，\n\n也是因为有债务，我想要鸡蛋，你想要牛奶，但是我们换着发现这两天我家鸡生的太多了，然后你家牛奶不产奶了，然后我希望更多的东西被看到，我们可以更容易发出一些请求，我想要一个住宿，但是我并不是什么都不给你，我给你100分，虽然我暂时不知道你会怎么去100分会换什么东西，我也不知道我以后能不能跟你换到，我们可以先把债记着，这是我想做账本的原因，就是我现在做的账本，然后你就能记一些点。然后对，我可以打开一下。这样的我就可以照着演示了，所以我做了一些，所以我做了几个功能，你可以，你可以记录我想要的东西和我可以给的东西，这是我是一个邀请，等到大家都在群里的时候，待会我发一下。我分享有，我东西有一个测试群，\n\n有时双方愿意交换，但当下没有恰好匹配的东西。先欠着，等以后有机会。可它也可能一直没有兑现。一个给我好东西的人，能不能从别人那里获得好东西？"},{"id":53,"layout":"words","group":4,"title":"这些事情，谁一直在做？","subtitle":"社区里看不见的劳动","items":[["打扫",""],["整理",""],["照料",""],["维护",""]],"origin":"personal","narration":"他可能就会受挫，他就可能下一次不会再做这样的尝试。我想的是，我们能不能把更多的中间，我们人和人之间的流动记下来，在一个社区网络里面，我们多多少少都是有对一个人的印象的，你提到一个人，你可能会发现他和周围的人是建立了很多联系的，我们能不能把东西记下来。然后再在，在社区里面有很多隐形劳动，比如说有人倒垃圾，有人扫地，他认为是一种义务，他并不是说我要通过去获得住宿，通过来获得饭，他也是可以被看见的，他可以变成认证的好人，我觉得作为认证的好人，你得到好处，如果大家都认为你是个好人，我们都希望你有好报，即使你你只是笑得很，你笑得很灿烂，在你旁边的人都会觉得很开心，它也是一个很好的价值。我希望这种价值被看到，这就是我想做一个网络的原因，我希望请求更容易发生，因为很多时候是不一定匹配的，货币的产生，\n\n也是因为有债务，我想要鸡蛋，你想要牛奶，但是我们换着发现这两天我家鸡生的太多了，然后你家牛奶不产奶了，然后我希望更多的东西被看到，我们可以更容易发出一些请求，我想要一个住宿，但是我并不是什么都不给你，我给你100分，虽然我暂时不知道你会怎么去100分会换什么东西，我也不知道我以后能不能跟你换到，我们可以先把债记着，这是我想做账本的原因，就是我现在做的账本，然后你就能记一些点。然后对，我可以打开一下。这样的我就可以照着演示了，所以我做了一些，所以我做了几个功能，你可以，你可以记录我想要的东西和我可以给的东西，这是我是一个邀请，等到大家都在群里的时候，待会我发一下。我分享有，我东西有一个测试群，\n\n打扫、整理、照料，还有维护社区和工具的工作，常常由少数人反复承担。事情做好了，却不一定被看见。我们能不能更具体地注意到这些劳动？"},{"id":54,"layout":"network","group":4,"title":"让这些点，彼此看见","subtitle":"因我而连接起来的人，他们之间也能流动","items":[],"network":"mesh","origin":"personal","narration":"总之我后面就想一个给我好东西的人，他能不能也获得一些好东西，我就想能不能把人组成网络，就有的时候，比如说我分享完的群里面就惠，有人说能不能给我，有没有人能够给我提供 a 地方的住宿，但因为他和其他人都不认识别人，跟他没有信任，说我愿意邀请你到我家来住，他没有信任的过程，他可能很难得到，\n\n他可能就会受挫，他就可能下一次不会再做这样的尝试。我想的是，我们能不能把更多的中间，我们人和人之间的流动记下来，在一个社区网络里面，我们多多少少都是有对一个人的印象的，你提到一个人，你可能会发现他和周围的人是建立了很多联系的，我们能不能把东西记下来。然后再在，在社区里面有很多隐形劳动，比如说有人倒垃圾，有人扫地，他认为是一种义务，他并不是说我要通过去获得住宿，通过来获得饭，他也是可以被看见的，他可以变成认证的好人，我觉得作为认证的好人，你得到好处，如果大家都认为你是个好人，我们都希望你有好报，即使你你只是笑得很，你笑得很灿烂，在你旁边的人都会觉得很开心，它也是一个很好的价值。我希望这种价值被看到，这就是我想做一个网络的原因，我希望请求更容易发生，因为很多时候是不一定匹配的，货币的产生，\n\n 这样一个事情。所以。这个惠有负债，你有负债羞耻，你可以羞耻，我觉得无所谓，我觉得大家都会有一点羞耻，才能维持团体的运行。\n\n基本上就是我想要做，可能我希望这个交换它本来就很容易发生，它可以多发生，我们有一个记录的机制可以让它更容易发生。大概是这样好，然后，然后还有什么问题吗？\n\n甲帮乙修电脑，双方协商十点。甲加十，乙减十。后来丙帮甲做饭，也商量十点。甲回到零，丙加十。甲不用等乙恰好有自己需要的东西，才能获得下一次帮助。"},{"id":56,"layout":"rows","group":4,"title":"想要、提供、互助、感谢","subtitle":"这些记录，可以帮助我们彼此看见","items":[["我想要 / 我可以给","表达需要，也让别人知道自己的资源与技能。"],["互助记录","记录已经发生的帮助，让贡献在网络里继续流动。"],["好人好事","说出谁帮了我，让具体的善意被看见。"]],"origin":"personal","narration":"也是因为有债务，我想要鸡蛋，你想要牛奶，但是我们换着发现这两天我家鸡生的太多了，然后你家牛奶不产奶了，然后我希望更多的东西被看到，我们可以更容易发出一些请求，我想要一个住宿，但是我并不是什么都不给你，我给你100分，虽然我暂时不知道你会怎么去100分会换什么东西，我也不知道我以后能不能跟你换到，我们可以先把债记着，这是我想做账本的原因，就是我现在做的账本，然后你就能记一些点。然后对，我可以打开一下。这样的我就可以照着演示了，所以我做了一些，所以我做了几个功能，你可以，你可以记录我想要的东西和我可以给的东西，这是我是一个邀请，等到大家都在群里的时候，待会我发一下。我分享有，我东西有一个测试群，\n\n我分享是因为我要推广测试，我就必须把这个东西是什么和我为什么要做，讲清楚，你就可以记一笔互助，我希望它能让一个，它能让一个请求，你更容易向别人发出请求，你想要这个东西，然后也让别人更容易拒绝。一个人说，我愿意把我的房间给一个姐妹住，但是要给我50块钱，可能如果有一个人愿意给他50块钱，可能就会去住，但是他不一定，他们之间也没有足够的信任，愿意邀请一个陌生人来家里住，我希望用一个中中介，中介，它不是金钱，他可以也很容易拒绝，我觉得，我不想要东西。然后大家记录他的，我想要给什么，我可以给什么，然后记录一些好人好事，谁帮了，他可能不是一个，他不是，我要给他多少东西，他只是帮了我，这个事情在我这儿发生了，我希望记一笔，他是一个好人，然后我们就希望好人能够获得一些好报，大概是这样。所以这个是我开始开放了一个，开放了一个网络，\n\n大概这样，比如说我这个群，我这个群是灯灯在帮我拉人，我不想让。我不喜欢拉群，就不想拉人进群，我很喜欢拉群，但是我不喜欢拉人进群，这是矛盾，我就需要解决矛盾大概是这样，所以后。好有意思！办公区或工位？\n\n总之我好久没登录了，我现在看了一下，欢迎大家进群，你们等会没进群我再发一下，你们要找谁进群不要找我对，你们要不可以加我微信，然后再进群。好，继续，总之我就想做，你能发表达，然后和周围人建立联系，我觉得是很适合社区的东西，它是能在网络中联系的，它默认的是可以欠债，可以欠债，我们认为我们是一个群体，这个群体你在对群体里的任何一个人做好事，做出贡献，给他一个东西，就认为你在为整体的群体做贡献，一个人他拿了从这个群体拿了很多东西，代表这个群体在为他做一些事情，他在得到这个群体的帮助，他一个代表我们之间关系，它不是债务，它不？我欠了谁几百块钱，它不是 a 欠了 b500块钱这样的事情，它是我们在这个群体里发生了很多善意的流动，我们发现有一些人一直在为群体做贡献，然后有一些人他们得到了群体的妥善的帮助，是这样一个事情。所以。这个惠有负债，你有负债羞耻，你可以羞耻，我觉得无所谓，我觉得大家都会有一点羞耻，才能维持团体的运行。\n\n基本上就是我想要做，可能我希望这个交换它本来就很容易发生，它可以多发生，我们有一个记录的机制可以让它更容易发生。大概是这样好，然后，然后还有什么问题吗？"},{"id":57,"layout":"question","group":4,"title":"有额度，\n也不代表别人必须答应","subtitle":"具体交换，仍然由人和人商量","items":[],"origin":"personal","narration":"我分享是因为我要推广测试，我就必须把这个东西是什么和我为什么要做，讲清楚，你就可以记一笔互助，我希望它能让一个，它能让一个请求，你更容易向别人发出请求，你想要这个东西，然后也让别人更容易拒绝。一个人说，我愿意把我的房间给一个姐妹住，但是要给我50块钱，可能如果有一个人愿意给他50块钱，可能就会去住 以后能不能跟你换到，我们可以先把债记着，这是我想做账本的原因，就是我现在做的账本，然后你就能记一些点。然后对，我可以打开一下。这样的我就可以照着演示了，所以我做了一些，所以我做了几个功能，你可以，你可以记录我想要的东西和我可以给的东西，这是我是一个邀请，等到大家都在群里的时候，待会我发一下。我分享有，我东西有一个测试群，\n\n我分享是因为我要推广测试，我就必须把这个东西是什么和我为什么要做，讲清楚，你就可以记一笔互助，我希望它能让一个，它能让一个请求，你更容易向别人发出请求，你想要这个东西，然后也让别人更容易拒绝。一个人说，我愿意把我的房间给一个姐妹住，但是要给我50块钱，可能如果有一个人愿意给他50块钱，可能就会去住，但是他不一定，他们之间也没有足够的信任，愿意邀请一个陌生人来家里住，我希望用一个中中介，中介，它不是金钱，他可以也很容易拒绝，我觉得，我不想要东西。然后大家记录他的，我想要给什么，我可以给什么，然后记录一些好人好事，谁帮了，他可能不是一个，他不是，我要给他多少东西，他只是帮了我，这个事情在我这儿发生了，我希望记一笔，他是一个好人，然后我们就希望好人能够获得一些好报，大概是这样。所以这个是我开始开放了一个，开放了一个网络，\n\n大概这样，比如说我这个群，我这个群是灯灯在帮我拉人，我不想让。我不喜欢拉群，就不想拉人进群，我很喜欢拉群，但是我不喜欢拉人进群，这是矛盾，我就需要解决矛盾大概是这样，所以后。好有意思！办公区或工位？\n\n总之我好久没登录了，我现在看了一下，欢迎大家进群，你们等会没进群我再发一下，你们要找谁进群不要找我对，你们要不可以加我微信，然后再进群。好，继续，总之我就想做，你能发表达，然后和周围人建立联系，我觉得是很适合社区的东西，它是能在网络中联系的，它默认的是可以欠债，可以欠债，我们认为我们是一个群体，这个群体你在对群体里的任何一个人做好事，做出贡献，给他一个东西，就认为你在为整体的群体做贡献，一个人他拿了从这个群体拿了很多东西，代表这个群体在为他做一些事情，他在得到这个群体的帮助，他一个代表我们之间关系，它不是债务，它不？我欠了谁几百块钱，它不是 a 欠了 b500块钱这样的事情，它是我们在这个群体里发生了很多善意的流动，我们发现有一些人一直在为群体做贡献，然后有一些人他们得到了群体的妥善的帮助，是这样一个事情。所以。这个惠有负债，你有负债羞耻，你可以羞耻，我觉得无所谓，我觉得大家都会有一点羞耻，才能维持团体的运行。\n\n基本上就是我想要做，可能我希望这个交换它本来就很容易发生，它可以多发生，我们有一个记录的机制可以让它更容易发生。大概是这样好，然后，然后还有什么问题吗？\n\n社区货币不能替代已经存在的流动。免费的、纯分享的、不记账的善意，需要被持续维护和示范。工具只是增加一个选项。"},{"id":59,"layout":"section","group":5,"title":"个人的交换，\n怎样长成社区的流动？","subtitle":"前面是我怎样生活，接下来是我们怎样一起生活","items":[],"accent":"green","origin":"bridge","narration":"前面讲的是我怎样认识自己的需要，怎样发现和创造选项，以及怎样与具体的人交换。接下来，我想把视角放到整个社区：这些关系怎样彼此看见，哪些流动会卡住，机制怎样支持它们，同时保护人的选择和善意。"},{"id":60,"layout":"section","group":5,"title":"在这个社区里，\n我们已经怎样生活？","subtitle":"先看已经发生的流动","items":[],"accent":"green","origin":"community","narration":"在做工具之前，我想先看看社区里已经发生了什么。大家本来就在分享、交换和互相帮助。交换圈要从这些关系里长出来。"},{"id":61,"layout":"story","group":5,"title":"水果吃不完，就分给大家","subtitle":"无偿分享","items":[["“我的就是你的”","基于信任，不求回报，也不一定求被看见"]],"origin":"community","narration":"比如水果吃不完，多出来的就分给大家。这种分享可以有来有回，也可以没有回报。它本来就是我们生活在一起的一部分。"},{"id":62,"layout":"words","group":5,"title":"有些互助，确实需要花力气","subtitle":"成本互助","items":[["搬家","时间与体力"],["按摩","技能与精力"],["咨询","经验与专注"],["修电脑","知识与劳动"]],"origin":"community","narration":"帮忙搬家、按摩、咨询、修电脑，都需要时间、精力和技能。它们可以在社区内部流动，但也需要一个双方认可的交换框架。"},{"id":63,"layout":"rows","group":5,"title":"这几种流动，可以同时存在","subtitle":"每一种，都有自己的成立方式","items":[["无偿分享","基于信任，可以不求回报"],["交换","双方找到认可的方式"],["成本互助","承认时间、精力与技能的投入"]],"origin":"community","narration":"分享、交换和有成本的互助可以并存。我们不必让每一种流动都使用同一个机制，也不需要把原有的分享都变成交易。"},{"id":64,"layout":"statement","group":5,"title":"我希望很多价值，\n能留在社区里","subtitle":"用社区内部的循环，创造更多生活选项","items":[],"accent":"yellow","origin":"community","narration":"我希望用自己的创造代替消费，用交换代替购买，用社区内部的循环替代一部分对外部市场的依赖。让更多创造力和连接发生在人和人之间，缩短中间的媒介。"},{"id":65,"layout":"section","group":5,"title":"社区里已有很多资源\n流动，为什么仍然卡住？","subtitle":"信任、可见性和开口的障碍","items":[],"accent":"pink","origin":"community","narration":"资源已经存在，愿意帮助人的人也已经存在。但为什么很多需要还没被回应？我看到的障碍，主要在于信任不能传递、付出不可见，以及不好意思开口。"},{"id":66,"layout":"columns","group":5,"title":"我信任的人，\n怎样被更多人了解？","subtitle":"信任不能只停在两个人之间","items":[["我知道","他曾经帮过我，我们共同做过事情。"],["别人还不知道","他给过什么、与谁有过连接，这些信息没有流通。"]],"origin":"community","narration":"比如有人在群里问免费住宿，但提供住宿的人还不了解他。他曾经给过什么、是什么样的人，这些信息不流通。我很难替所有人判断关系，也很难帮他们直接达成交换。"},{"id":67,"layout":"story","group":5,"title":"“我帮了你”\n只有你和我知道","subtitle":"付出不可见","items":[["私下的五次帮助","如果信息没有流通，社区仍然不了解这些贡献。"]],"origin":"community","narration":"一个人可能帮过好几个人，但每次都是私下的。在社区层面，他的付出仍然不可见。这不是故意忽视，而是信息没有流通。"},{"id":68,"layout":"statement","group":5,"title":"少数人反复承担，\n也会疲惫","subtitle":"让隐形劳动被看见，是关系能否持续的问题","items":[],"accent":"pink","origin":"community","narration":"如果少数人一直承担看不见的工作，他们容易疲惫，难以持续。被看见，不只是夸奖一句，也关系到社区怎样了解和支持正在付出的人。"},{"id":69,"layout":"question","group":5,"title":"当别人接受帮助，\n流动才继续发生","subtitle":"愿意给的人，也需要有人能够自在地接受","items":[],"origin":"community","narration":"如果所有人都愿意给，却没有人开口拿，流动也不会发生。帮助和被帮助需要一起成立。让人更容易提出小请求，是这套实验非常重要的一部分。"},{"id":70,"layout":"layers","group":6,"title":"交换圈的三层设计","subtitle":"基础是关系，机制在需要的时候加入","items":[["01","交换与分享","求助、给予、一对一交换，原本就在发生。"],["02","感谢的信号","接收者主动表达看见，让善意被了解。"],["03","有成本的互助","双方认可记账，让贡献在圈内继续流动。"]],"origin":"community","narration":"第一层是已经存在的交换与分享。第二层是好人卡，表达感谢和被看见。第三层是有成本的互助使用的记账框架。它们各自回应不同的问题。"},{"id":71,"layout":"statement","group":6,"title":"愿意免费就免费\n愿意不记就不记","subtitle":"基础交换不需要工具来许可","items":[],"accent":"green","origin":"community","narration":"基础是交换与分享。大家尝试求助，看能不能相互给予。可以不求回报，也可以一对一交换。愿意免费就免费，不需要替代或介入已经存在的善意交换。"},{"id":72,"layout":"section","group":6,"title":"一句感谢，\n让善意被看见","subtitle":"第二层：好人卡","items":[],"accent":"coral","origin":"community","narration":"在已有的分享之上，接收者如果愿意，可以主动多做一个动作：留下感谢。它表达我感受到了什么，也让更多人有机会看见这段关系。"},{"id":73,"layout":"dialogue","group":6,"title":"这件事，由接收者主动记","subtitle":"给予者可以没有想过要被记录","items":[["给予者","我给的时候，没有想要回报。"],["接收者","我感受到了，想说一句：谢谢你。"]],"origin":"community","narration":"这是设计中很关键的区别。给予者可能没有想过被记录，也没有想过要回报。但接收者感受到了，可以主动留下一个看见的信号。不需要付出者自己来请求认可。"},{"id":74,"layout":"comparison","group":6,"title":"感谢，与记账各有边界","subtitle":"它们表达不同的事情","items":[["感谢信号","接收者主动表达看见","不创造债务","不能拿来换东西"],["互助记账","双方认可有成本的交换","记录给过与接受过","支持以后向圈内请求"]],"origin":"community","narration":"好人卡跟金钱没有关系，不能换东西，也不会因为我感谢了你，就让我背负债务。有成本的互助才使用双方认可的额度。感谢与记账，要清楚地区分。"},{"id":75,"layout":"letter","group":6,"title":"它像一封 reference letter","subtitle":"给一个真人，留下一段具体的话","items":[["让关系成为线索","我们之间发生过什么？我感受到了什么？"],["让信任能够传递","当你走进另一个圈子，有人可以了解这些经历。"]],"origin":"community","narration":"文档里，我把好人卡比喻成一封 reference letter，也像一个帮助人在社区之间流动的护照。它留下具体的善意和关系，让别人有线索去了解你。具体可见范围仍然要以产品当前规则为准。"},{"id":76,"layout":"story","group":6,"title":"“我看到你一直\n在为社区做事情”","subtitle":"让原本隐形的劳动，被人主动说出来","items":[["接收者与见证者的主动性","付出者不必自己申请认可，也不必先开出价格。"]],"origin":"community","narration":"有人一直倒垃圾，但没有被看到。看到的人可以把这件事说出来，表达感谢。我希望这种认可来自感受到的人，而不是要求付出者拿着劳动清单来申请。"},{"id":77,"layout":"comparison","group":6,"title":"看见善意，\n也保护它原来的动机","subtitle":"不让义务与善意变成计件工资","items":[["后置的感谢","你已经这样做了。","我看到了，想表达感谢。"],["固定的计件报酬","做一次，就固定得到多少。","善意可能开始围绕报酬组织。"]],"origin":"community","narration":"如果一个人本来愿意做一点，却被机制变成倒一次垃圾固定领多少报酬，这件事的感受会变得不同。看见善意的信号是后置的，不应把义务和善意变成计件工资。"},{"id":78,"layout":"section","group":6,"title":"有成本的互助，\n需要一个交换框架","subtitle":"第三层：社区范围内的记账","items":[],"accent":"blue","origin":"community","narration":"按摩、修电脑、搬家和咨询，确实有时间、精力和技能成本。对于这样的互助，我们可以使用双方都认可的交换框架。"},{"id":79,"layout":"question","group":6,"title":"我可以开口请求帮助","subtitle":"即使我们暂时没找到能直接互换的东西","items":[],"origin":"community","narration":"这个机制是为了让提出需求的人更容易求助。我提出请求，另一个人愿意回应，不需要马上想好我能给他什么。有一个圈内认可的交换框架，会帮助人更容易开口。"},{"id":80,"layout":"pair","group":6,"title":"信用，在互助发生时共同创造","subtitle":"甲帮助乙，双方协商记 10 点","items":[["甲","+10","提供了帮助"],["乙","−10","接受了帮助"]],"origin":"community","narration":"这是相互信用的设计。甲帮助乙，一方增加，另一方减少。额度在交易发生时共同创造，不需要先由个人持有一笔现金储备。这一页仍然是机制示例。"},{"id":81,"layout":"statement","group":6,"title":"这段关系，\n放在整个圈子里看","subtitle":"贡献与请求，不只停在两个人之间","items":[],"accent":"blue","origin":"community","narration":"甲的正余额，不是乙对甲的私债，而是面向整个网络的未来请求权。乙的负余额，也不是对甲个人的私债，而是对网络的一项未来贡献承诺。"},{"id":82,"layout":"columns","group":6,"title":"给过，也接受过帮助","subtitle":"两种经历都可以被承认","items":[["正余额","曾经提供帮助。对网络保留未来请求的可能。"],["负余额","曾经接受帮助。也保留未来贡献的承诺。"]],"origin":"community","narration":"帮助和被帮助是平等、互相成就的事情。正数可以记录给过，负数可以记录接受过帮助。它们不定义一个人的价值，也不应该让负余额变成羞耻。"},{"id":83,"layout":"statement","group":6,"title":"不需要人人急着归零","subtitle":"我想看见的是给过、拿过，以及关系怎样持续","items":[],"accent":"yellow","origin":"community","narration":"社区货币不需要追求账户归零。它记录曾经给过和曾经拿过。真正值得看的，是请求有没有发生，贡献能不能得到回应，以及关系怎样持续。"},{"id":84,"layout":"community","group":6,"title":"社区本身，也可以参与互助","subtitle":"公共的需要，不必只由某一个人承担","items":[["社区需要","有人整理公共空间"],["成员提供","投入时间与劳动"],["社区主体","可以给予，也可以欠账"]],"origin":"community","narration":"社区本身也可以作为主体，可以欠账，也可以给予。比如公共空间需要人打扫，它可以明确提出这项需要。工具与社区的维护劳动，也需要被看见。"},{"id":85,"layout":"columns","group":6,"title":"劳动，与材料现金成本可以分开","subtitle":"承认成本，也保留互助的可能","items":[["时间与劳动","可以商量圈内认可的互助额度。"],["材料与交通","如果有明确的现金支出，可以另外承担。"]],"origin":"community","narration":"如果有明确的材料或交通成本，可以考虑混合支付：劳动力用社区货币，材料成本用现金。我们需要承认实际成本，再讨论哪些部分可以在社区内部流动。"},{"id":86,"layout":"section","group":7,"title":"关系里，\n必须保留选择","subtitle":"请求、拒绝与社区边界","items":[],"accent":"pink","origin":"community","narration":"如果记录和额度让人更难拒绝，或者让人觉得自己必须服务所有人，机制就没有达到我的目的。我们需要让选择仍然保留在人的关系里。"},{"id":87,"layout":"statement","group":7,"title":"可以拒绝\n可以商量\n可以暂停","subtitle":"不需要用服从，来证明自己值得参与","items":[],"accent":"pink","origin":"community","narration":"任何人都可以拒绝、取消或中止一个请求。不需要解释，也不因此失去以后参与的机会。我希望请求更容易，拒绝和商量也更容易。"},{"id":88,"layout":"boundaries","group":7,"title":"一个交换圈，需要明确的边界","subtitle":"我们怎样在这个范围里建立信任？","items":[["谁可以参与","先理解这个社群的关系与约定。"],["什么愿意开放","免费住宿，也需要提供者自己选择。"],["具体怎样交换","自己敲门，找到喜欢的人与关系。"]],"origin":"community","narration":"我不能告诉所有人：你去找谁就一定可以免费住。因为这不是一个对所有人开放的契约。一个圈子需要明确边界，而人在关系里的偏好与选择也要保留。"},{"id":89,"layout":"quote","group":7,"title":"当大家开始觉得\n“没有记录的就不算”\n社区货币就已经越界了","subtitle":"","items":[],"origin":"community","narration":"我想把这句话留在这里。当大家开始觉得没有记录的就不算，社区货币已经越界了。我们不能让记录成为善意成立的条件。"},{"id":90,"layout":"scenarios","group":8,"title":"同一套理念，长在不同的关系里","subtitle":"三种实践场景","items":[["身边的交换网络","让点对点的关系彼此看见"],["小范围共建共创","在约定时间和范围内一起交换"],["线下常驻社区","让日常互助和隐形劳动被了解"]],"origin":"community","narration":"它可以从我身边的交换网络开始，也可以是有既定时间的一群人共同创造，或者一个线下常驻社区。每种关系的范围、需要和约定都不同。"},{"id":91,"layout":"story","group":8,"title":"我们一起住、一起做事\n也一起维护这个地方","subtitle":"线下常驻社区","items":[["日常的互助","写下需要与提供，具体交换双方商量。"],["公共的维护","打扫、整理、照料与维护劳动，都可以被看见。"]],"origin":"community","narration":"在常驻社区里，互助就在日常生活中。我们可以写下给你、给我的清单，价格双方商量。维护这个空间和维护工具的劳动，也应该被看见。负余额不应被污名化。"},{"id":92,"layout":"story","group":8,"title":"有一段共同生活的时间\n也可以有一个明确的交换范围","subtitle":"小范围共建共创","items":[["在这个圈内尝试","请求帮助、互相提供服务、许愿、悬赏与打赏。"],["先说清约定","参与范围、初始安排，以及不向圈外流通的边界。"]],"origin":"community","narration":"有既定时间的一群人共创，也可以做实验。大家在约定的圈子里请求帮助、提供服务、许愿或悬赏。文档曾提出初始抵押兑换的方案，它是一种特定场景的设想，不是所有交换圈的统一起点。"},{"id":93,"layout":"question","group":8,"title":"我们想验证的，\n到底是什么？","subtitle":"它是否让人更容易开口，又没有更难拒绝、被比较或被消耗？","items":[],"origin":"community","narration":"要验证的不是流通量够不够漂亮，而是原本开不了口的人有没有更容易提出一个小请求，同时没有让任何人更难拒绝、被比较或被消耗。"},{"id":94,"layout":"questions","group":8,"title":"关于流动，我想持续问","subtitle":"","items":[["愿意给的人","是否更轻松地给了？"],["想要帮助的人","是否少了一些接受的障碍？"],["收到请求的人","是否更容易拒绝，或者更容易商量？"],["圈子里的技能","是否因为被看见，更容易被发现？"]],"origin":"community","narration":"愿意给的人是否更轻松？想拿的人是否更少障碍？收到请求的人是否更容易拒绝和商量？有哪些技能因为被看见，更容易被发现？这些都需要在真实关系里观察。"},{"id":95,"layout":"questions","group":8,"title":"关于被看见，我想持续问","subtitle":"","items":[["隐形的劳动","打扫、整理、照料，是否被注意到了？"],["主动的感谢","接收者是否愿意主动留下记录？"],["传递的信任","有没有从一个不太熟的人那里获得帮助？"]],"origin":"community","narration":"付出的人是否真的被看见？接收者有没有主动发出感谢？有没有人从一个不太熟的人那里换到了帮助？这才是在问，信任有没有真的传递。"},{"id":96,"layout":"questions","group":8,"title":"关于善意，我想持续问","subtitle":"","items":[["礼物的空间","有没有本来会是礼物的事情，被不舒服地变成交易？"],["维护者的付出","维护社区与工具的劳动，是否也被看见？"]],"origin":"community","narration":"我们要留意，有没有本来会是礼物的事情，被不舒服地变成了交易。也要看维护这套关系与工具的人，付出是否被看见。维护劳动本身也是社区需要回应的事情。"},{"id":97,"layout":"questions","group":8,"title":"这些状态，值得一起留意","subtitle":"作为实验的提醒","items":[["人人都为正","却没有人敢花、敢请求。"],["只愿意接单","本来免费的分享，开始都需要先谈额度。"],["不好意思拒绝","记录和余额，反而增加了关系里的压力。"]],"origin":"community","narration":"如果人人都为正，没有人敢花，流动仍然卡住。如果免费的分享都开始先谈额度，或者有人更难拒绝，我们就需要重新看机制。本页是基于文档问题整理的观察提醒，不是对当前社区的判断。"},{"id":98,"layout":"boundaries","group":8,"title":"如果我们要一起试，\n先把这些约定聊清楚","subtitle":"从自己的社区出发","items":[["参与范围","谁参与？怎样加入、暂停或离开？"],["交换方式","哪些保持免费？哪些需要承认时间和成本？"],["维护与反馈","谁照料这个实验？不舒服的时候向哪里反馈？"]],"origin":"community","narration":"一个社区可以先一起谈清楚参与范围，哪些流动保持免费，哪些互助需要交换框架，以及谁来维护这个实验。这些是根据理念组织的讨论建议，要由实际参与的人一起决定。"},{"id":99,"layout":"rows","group":9,"title":"让行动更容易发生","subtitle":"从自己现在愿意做、做起来轻松的事情开始","items":[["有动机","这件事是我想做的，也让我觉得好玩。"],["条件具足","把事情变简单，找到可以一起做的人。"],["不必独自完成","不喜欢拉人进群，就寻找愿意提供帮助的人。"]],"origin":"personal","narration":"他也我想的，你在这种想法和行动之间，你为什么可以，因为我有你微信，有一段时间，有时候看你的朋友圈，我记得之前你有拉过一个群，类似于大家发起自己想做的事情，看有没有可以跟大家合作的，我觉得你一直是行动能力特别强，比如说我也有这种想法，我在这种想法和行动之间。很远，这个距离很远，我想完之后可能就不去做了，然后你想完之后你会立即付出行动，包括你的所有的想法，你的输出都感觉由想法变到行动之间的路径很短，为什么可以行动力如此之强。我研究了蛮久，我的行动力的，我觉得可能你只是看到了那部分做了的部分，我想的可多，我还是有很多想的事没有做。上次视频也没做，那是我发现我不想做，我会有很多半途而废和做一下或者纯想的事情，它是很多的，但是我并不会批判自己，我就觉得它缘分没有到，我能保证的是把我的所有的时间和精力花在我目前愿意做，它能发生，做起来还轻松，我还愉快的事情上。它可能行动力发生，\n\n它有一些要素，行动力它是自然而然的发生的，它本来就是没有，没有什么链路的，当它条件具足的时候，当这个事情它又好玩，你又有动机去做它，它又很简单，它没有那么困难。然后一般对我来说，有一群人。\n\n要不然我可能不会写这个什么不消费的分享，但现在我巴拉讲完了，大家再问我问题，我就能把 ppt 做出来。我之后根据这个总结，我就能写一篇文章。这件事情它是我可以设计一些条件，让它更容易发生，还有可能会发现有些东西如果我想做，过了好久我没做，说明我可能没那么想。我以为我想，我其实不想，它肯定中间有很多东西，所以现在所有的行动，你在做的时候都没有觉得有什么困难，或者说它启动起来很简单，或者说让你得到了一些正反馈，然后不断的激励你，它是一个正向的循环，然后要是有困难，你就找一些更轻松的方式，我就觉得我不想拉人进群，我要做这个事，我就找人拉，找人拉进群，我一定会找一些怎么能让我更愿意干这个事，这是可以研究的，我觉得它是会越来越顺的，就我觉得我。\n\n过去这么多年来，几十年来，困扰我太拖延了，我行动力太低了，什么，我的盖洛普那个盖洛普，盖洛普表就是我最低的，我的执行全都是在最后的，执行都是最最最后面的，我是没有什么执行力的人，但是我是在我就发现这好像是我的天赋，因为我没有办法干任何我觉得我不想干的事情，然后想干的事情，我就，我就能容易完成，我觉得一个人的行动太。\n\n它一个化学，化学方程式一样，它条件记住，它自然就会发生。它没发生，它一定中间前面有一些东西是缺的，你可能没那么想做，或者你觉得它很难，那就，那就先别做很难，你就做一点儿，它一定有一些事情是你现在就能发生的，你就去做它就。然后你堆起来，别人就会觉得你做多事情。是不是你因为你的想法格外的多，所以说看到你的那些行动就是做出来的事情很多了，可能你脑子里面就是成千上万倍更多的你，那我不太知道，你可以记一下，你的想法，它到底是啥，我也没有记，所以我也不知道它到底多不多，然后。有一个是如果总这样子互换，会不会算是一直物化自己？"},{"id":100,"layout":"invitation","group":9,"title":"现在，你有什么\n小小的愿望？","subtitle":"从一件具体的小事开始","items":[["我想要","我正在需要什么帮助？"],["我愿意给","我有什么愿意分享、交换或共同创造？"]],"origin":"personal","narration":"明天的分享要他，今天的，这个群里为什么有67条消息好神奇，然后。明天的分析，今天的如果你们还没有进群，请你加。请你加他。我邀请大家进群是，参加入一下这个圈子，填一下自己的想要，然后。可以。还有什么问题吗？\n\n好，我已经完成了我今天的很多任务。没有我们就能顺利结束，让我再看一眼。\n\n现在你有什么小小的愿望？你愿意给什么？我们可以先从一件具体的小事开始。提供什么、接受什么，都可以自己选择。"},{"id":101,"layout":"statement","group":9,"title":"我们一起，\n创造一个新的生活选项","subtitle":"让更多的创造力和连接，发生在人和人之间","items":[],"accent":"yellow","origin":"personal","narration":"它在于我知道我自己想要什么，我真正需要的是什么。我可以连接周围的世界，因为我和周围的世界，我肯定不是孤立的人，反而是消费的事情，让我们变得原子化，我们，我们当我们需要一个心理支持好，我们得去找，我们得去找 ai，然后或者我们得去找心理咨询师，我们可能周围没有支持网络，然后我们现在需要一顿饭，我们要去点个外卖。这些非常精细的消费品，\n\n满足需求的消费品，它让我们和周围的世界的联系变弱了，因为我们中间有金钱或者有很长的链条作为媒介，其实我们本身就是能和周围的世界发生很多联系的，它就在于，我能提供什么？我可以向谁提出请求，也许谁有我想要的东西，然后我们我跟这个人一起，我们能不能共同创造一些，也许我身上有他要的，然后也许他身上有我要的。我们可以创造更多的选项，可以有更多的可能性去获得，这样我们就能获得生活的所需，不需要通过消费去填所需，然后它也能积累生活的韧性，韧性可能包括我在这个过程中，我有更强的能力，因为我一直在提供价值，是直接的提供价值，我有更多元的能力，然后我有更多元的关系，这让我在，发生困难的时候，他能获得帮助，让我想，比如说我们在做工人的放映，就李一凡的片子的放映，然后。然后提到了一篇文章，他讲的是哈佛的一个研究，讲说阶级的不平等，\n\n它要怎么被消融，它大家住在一起就不同阶级的人，他们只要住在一起，有交流，就会发现更低阶级的人，他的收入可能会更高。我记得在一篇优绩主义的文章里也写了最终发生作用的是人和人之间的友善的互助。它可能在于，我发现这里有个机会，我想把机会给你，它可能是信息，它可能是认知，它可能是生活的习惯，它可能是什么，只要我们有跟周围的人建立关系，我们在社会，他不管多好多坏，我们能有更多的可能性去发生。你可能有更多的资源渠道，反正这些总之是我觉得我们在生活中可以尝试去做的，好好的，\n\n然后我看一下还有什么，那我讲一些具体的吧，具体的不花钱，有什么各种各想法。\n\n我想建立一个明确的交换圈，让已经存在的关系彼此看见，让请求更容易，也让选择和善意继续保有空间。我们一起，可以创造一个新的生活选项。"},{"id":102,"layout":"demo","group":9,"title":"接下来，\n演示流动圈","subtitle":"工具在这里，关系由我们一起创造","items":[],"origin":"community","narration":"接下来，我演示流动圈。具体功能可以现场看。我更关心的是，它有没有支持到我们在这个社区里真正想发生的关系。"}]</script><script src="assets/deck.js"></script></body></html>
